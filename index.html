<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MHA5e — Character Creator &amp; Campaign Tracker</title>
<style>
  :root {
    --bg: #0b1120;
    --panel: #131c31;
    --sub: #1a2640;
    --border: #263554;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --dim: #64748b;
    --yellow: #facc15;
    --crimson: #ef4444;
    --cyan: #38bdf8;
    --emerald: #10b981;
    --purple: #a855f7;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    font-size: 14px;
    line-height: 1.45;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .hud-font { font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
  /* Top Nav */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    background: rgba(11, 17, 32, 0.96);
    border-bottom: 2px solid var(--border);
    padding: 10px 14px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
    backdrop-filter: blur(8px);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 18px; font-weight: 900; color: var(--yellow); letter-spacing: 0.06em;
  }
  .brand-badge {
    background: var(--crimson); color: #fff; font-size: 10px; padding: 2px 6px;
    border-radius: 5px; letter-spacing: 0.08em;
  }
  .nav-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  /* Buttons & Inputs */
  button, select, input, textarea {
    font-family: inherit; font-size: 13px; color: var(--text);
    background: var(--sub); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 11px; outline: none; transition: 0.15s border-color, 0.15s background, 0.15s transform;
  }
  button { cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
  button:hover { border-color: var(--cyan); background: #223254; }
  button:active { transform: scale(0.98); }
  input:focus, select:focus, textarea:focus { border-color: var(--cyan); }
  input[type="text"], input[type="number"], select, textarea { width: 100%; }
  textarea { resize: vertical; }
  .btn-yellow { background: var(--yellow); color: #0b1120; border-color: var(--yellow); font-weight: 800; }
  .btn-yellow:hover { background: #fde047; border-color: #fde047; color: #0b1120; }
  .btn-cyan { background: rgba(56,189,248,0.16); border-color: var(--cyan); color: #e0f2fe; }
  .btn-cyan:hover { background: rgba(56,189,248,0.28); }
  .btn-crimson { background: rgba(239,68,68,0.18); border-color: var(--crimson); color: #fecaca; }
  .btn-crimson:hover { background: rgba(239,68,68,0.32); }
  .btn-emerald { background: rgba(16,185,129,0.18); border-color: var(--emerald); color: #d1fae5; }
  .btn-emerald:hover { background: rgba(16,185,129,0.3); }
  .btn-sm { padding: 5px 9px; font-size: 12px; }
  .btn-xs { padding: 3px 7px; font-size: 11px; border-radius: 6px; }
  /* Layout */
  .container { max-width: 1260px; margin: 0 auto; padding: 14px; }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.28);
  }
  .subcard {
    background: var(--sub); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px;
  }
  .select-card {
    background: var(--sub); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; cursor: pointer; text-align: left; width: 100%; display: block;
  }
  .select-card:hover { border-color: var(--cyan); background: #203050; }
  .select-card.selected { border-color: var(--yellow); background: rgba(250,204,21,0.1); box-shadow: 0 0 0 1px var(--yellow); }
  .grid { display: grid; gap: 12px; }
  .g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .g-7 { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .g-12 { grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .col-4 { grid-column: span 4; }
  .col-5 { grid-column: span 5; }
  .col-6 { grid-column: span 6; }
  .col-7 { grid-column: span 7; }
  .col-8 { grid-column: span 8; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .stack-sm { display: flex; flex-direction: column; gap: 7px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .row-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px; }
  .pill {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700;
    padding: 2px 8px; border-radius: 999px; background: #1e293b; border: 1px solid var(--border); color: var(--text);
  }
  .pill-yellow { background: rgba(250,204,21,0.16); border-color: var(--yellow); color: var(--yellow); }
  .pill-cyan { background: rgba(56,189,248,0.16); border-color: var(--cyan); color: var(--cyan); }
  .pill-crimson { background: rgba(239,68,68,0.18); border-color: var(--crimson); color: #fca5a5; }
  .pill-emerald { background: rgba(16,185,129,0.18); border-color: var(--emerald); color: #6ee7b7; }
  .pill-purple { background: rgba(168,85,247,0.18); border-color: var(--purple); color: #d8b4fe; }
  /* Tabs */
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tab-btn {
    padding: 8px 14px; border-radius: 8px; background: var(--panel);
    border: 1px solid var(--border); color: var(--muted); font-weight: 700;
  }
  .tab-btn.active { background: var(--yellow); color: #0b1120; border-color: var(--yellow); }
  /* Progress Bars */
  .bar { width: 100%; height: 11px; background: #090e1a; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; transition: width 0.2s ease; }
  .scroll-box { max-height: 360px; overflow-y: auto; padding-right: 4px; }
  .scroll-box::-webkit-scrollbar { width: 6px; }
  .scroll-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  /* Ability Card */
  .stat-card {
    background: var(--sub); border: 1px solid var(--border); border-radius: 9px;
    padding: 8px 6px; text-align: center;
  }
  .stat-mod { font-size: 20px; font-weight: 900; color: var(--cyan); margin: 2px 0; }
  .stat-score { width: 52px !important; text-align: center; padding: 3px !important; font-weight: 700; margin: 0 auto; }
  /* Skill Row */
  .skill-row {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 5px 8px; border-radius: 6px; background: rgba(11,17,32,0.45); border: 1px solid transparent;
  }
  .skill-row:hover { border-color: var(--border); }
  .prof-dot {
    width: 22px; height: 22px; border-radius: 50%; padding: 0; font-size: 11px; font-weight: 800;
    border: 1px solid var(--dim); background: transparent; color: var(--dim);
  }
  .prof-dot.p1 { background: var(--cyan); color: #0b1120; border-color: var(--cyan); }
  .prof-dot.p2 { background: var(--yellow); color: #0b1120; border-color: var(--yellow); }
  /* Wizard */
  .wiz-steps { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .wiz-step {
    flex: 1; min-width: 110px; padding: 7px 10px; border-radius: 8px; font-size: 12px; font-weight: 700;
    background: var(--sub); border: 1px solid var(--border); color: var(--muted); text-align: center; cursor: pointer;
  }
  .wiz-step.active { background: var(--yellow); color: #0b1120; border-color: var(--yellow); }
  .wiz-step.done { border-color: var(--emerald); color: #6ee7b7; }
  /* Modals */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 80; background: rgba(5, 9, 18, 0.8);
    display: flex; align-items: center; justify-content: center; padding: 14px;
  }
  .modal-box {
    background: var(--panel); border: 1px solid var(--cyan); border-radius: 12px;
    width: 100%; max-width: 620px; max-height: 90vh; overflow-y: auto; padding: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.65);
  }
  /* Slide-over Dice Tray */
  .dice-drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 340px; max-width: 94vw; z-index: 70;
    background: #0f172a; border-left: 2px solid var(--yellow);
    box-shadow: -10px 0 35px rgba(0,0,0,0.6);
    transform: translateX(100%); transition: transform 0.22s ease;
    display: flex; flex-direction: column; padding: 14px; gap: 10px;
  }
  .dice-drawer.open { transform: translateX(0); }
  /* Toast */
  .toast-wrap { position: fixed; bottom: 16px; left: 16px; z-index: 95; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  .toast {
    background: #0f172a; border: 1px solid var(--cyan); color: var(--text);
    padding: 9px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .toast.yellow { border-color: var(--yellow); color: var(--yellow); }
  .toast.crimson { border-color: var(--crimson); color: #fca5a5; }
  .hidden { display: none !important; }
  .pip {
    width: 18px; height: 18px; border-radius: 5px; padding: 0;
    border: 1px solid var(--cyan); background: rgba(56,189,248,0.22);
  }
  .pip.spent { background: #0b1120; border-color: var(--dim); opacity: 0.45; }
  .dice-link {
    display: inline; padding: 1px 5px; font-size: 11px; border-radius: 5px;
    background: rgba(250,204,21,0.14); border: 1px solid rgba(250,204,21,0.45); color: var(--yellow);
  }
  @media (max-width: 960px) {
    .g-7 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .g-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .col-4, .col-5, .col-6, .col-7, .col-8 { grid-column: span 12; }
  }
  @media (max-width: 600px) {
    .g-3, .g-2 { grid-template-columns: 1fr; }
    .g-7 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span>⚡ MHA5e</span>
    <span class="brand-badge">HERO HUD</span>
  </div>
  <div class="nav-group">
    <select id="heroSelector" style="width:auto;min-width:170px;" onchange="selectHero(this.value)"></select>
    <button class="btn-yellow btn-sm" onclick="startWizard()">+ Create Hero</button>
    <select id="presetMenu" style="width:auto;" onchange="handlePresetSelect(this)">
      <option value="">Quick Presets ▾</option>
      <option value="hellflame">🔥 Hellflame (Catalyst)</option>
      <option value="arbor">🌿 Arbor (Catalyst)</option>
      <option value="heal">💚 Heal (Catalyst)</option>
      <option value="erasure">👁 Erasure (Striker)</option>
    </select>
    <button class="btn-emerald btn-sm" onclick="openLevelUpModal()">⬆ Level Up</button>
    <button class="btn-sm" onclick="exportJSON()">⬇ Export JSON</button>
    <button class="btn-sm" onclick="openImportModal()">⬆ Import JSON</button>
    <button class="btn-cyan btn-sm" onclick="toggleDiceDrawer()">🎲 Dice Tray <span id="navLastRoll" class="pill pill-yellow hidden"></span></button>
  </div>
</header>

<main id="appRoot" class="container"></main>

<!-- Slide-over Dice Tray -->
<aside id="diceDrawer" class="dice-drawer">
  <div class="row-between">
    <span class="hud-font" style="color:var(--yellow);font-size:15px;">🎲 TACTICAL DICE TRAY</span>
    <button class="btn-xs" onclick="toggleDiceDrawer()">✕ Close</button>
  </div>
  <div class="row-wrap">
    <button class="btn-xs" data-rm="normal" onclick="setRollMode('normal')">Normal</button>
    <button class="btn-xs" data-rm="adv" onclick="setRollMode('adv')">Advantage</button>
    <button class="btn-xs" data-rm="disadv" onclick="setRollMode('disadv')">Disadvantage</button>
  </div>
  <div class="grid g-4" style="gap:6px;">
    <button class="btn-sm" onclick="quickDie(4)">d4</button>
    <button class="btn-sm" onclick="quickDie(6)">d6</button>
    <button class="btn-sm" onclick="quickDie(8)">d8</button>
    <button class="btn-sm" onclick="quickDie(10)">d10</button>
    <button class="btn-sm" onclick="quickDie(12)">d12</button>
    <button class="btn-cyan btn-sm" onclick="quickD20()">d20</button>
    <button class="btn-crimson btn-sm" onclick="rollClash()" style="grid-column:span 2;">⚔️ Clash d100</button>
  </div>
  <button class="btn-yellow btn-sm" style="width:100%;" onclick="rollPlusUltra()">⚡ PLUS ULTRA (3d20 Keep Highest)</button>
  <div class="row">
    <div style="width:76px;"><label class="label">Mod</label><input id="diceModInput" type="number" value="0" /></div>
    <div style="flex:1;"><label class="label">Custom Formula</label><input id="diceFormulaInput" type="text" placeholder="e.g. 4d10+3" onkeydown="if(event.key==='Enter')runCustomFormula()" /></div>
    <div style="align-self:end;"><button class="btn-cyan btn-sm" onclick="runCustomFormula()">Roll</button></div>
  </div>
  <div class="row-between">
    <span class="label" style="margin:0;">Roll History</span>
    <button class="btn-xs" onclick="clearRollLog()">Clear</button>
  </div>
  <div id="diceLog" class="stack-sm scroll-box" style="flex:1;max-height:none;"></div>
</aside>

<!-- Generic Modal -->
<div id="modalBackdrop" class="modal-backdrop hidden" onclick="if(event.target===this)closeModal()">
  <div id="modalBox" class="modal-box stack"></div>
</div>

<!-- Toasts -->
<div id="toastWrap" class="toast-wrap"></div>

const mod = (score) => Math.floor(((Number(score) || 10) - 10) / 2);
const fmt = (n) => (n >= 0 ? '+' + n : '' + n);
const pbOf = (lvl) => lvl >= 17 ? 6 : lvl >= 13 ? 5 : lvl >= 9 ? 4 : lvl >= 5 ? 3 : 2;
const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const uid = (p='id') => p + '_' + Math.random().toString(36).slice(2, 9);

function calcAutoHP(h) {
  const cls = CLASSES[h.classId] || CLASSES.striker;
  const cm = mod(h.stats.con);
  const base = cls.hitDie + cm + (h.level - 1) * (cls.avgHit + cm);
  const durCount = cls.durLevels.filter(l => l <= h.level).length;
  const dur = durCount * (cls.durBase + Math.max(0, Math.floor(cm / 2)));
  let bonus = 0;
  if (h.physiology === 'superhuman' && (h.physPicks || []).some(p => p.startsWith('Resilient Vitality'))) bonus += h.level;
  if (h.classId === 'catalyst' && h.spec === 'Overdrive' && h.level >= 2) bonus += h.level;
  if ((h.feats || []).some(f => f.startsWith('Durable'))) bonus += h.level * 2;
  if (h.quirk.name === 'Deathly Endurance') bonus += h.level * 3;
  return Math.max(1, base + dur + bonus + (h.hpBonus || 0));
}

function calcAutoAC(h) {
  const dm = mod(h.stats.dex), cm = mod(h.stats.con);
  const suitAc = Number(h.suit.ac) || 0;
  let ac = 10 + dm + suitAc;
  if (h.classId === 'striker') {
    ac = 10 + dm + cm;
    if (h.classKeyStat === 'dex') ac += (h.level >= 6 ? 2 : 1);
  } else if (h.classId === 'arsenal') {
    ac = Math.max(13 + Math.min(2, dm), 10 + dm + suitAc);
    if (h.spec === 'Ironclad' && h.level >= 2) ac += 1;
    if (h.spec === 'Blueprint' && h.level >= 5) ac += 1;
  }
  if (h.physiology === 'heteromorph' && (h.physPicks || []).some(p => p.startsWith('Tough Skin')) && suitAc === 0) ac += 1;
  return ac;
}

function calcSpeed(h) {
  let spd = (PHYSIOLOGIES[h.physiology] || PHYSIOLOGIES.standard).speed || 30;
  if (h.physiology === 'heteromorph' && (h.physPicks || []).some(p => p.startsWith('Hooves'))) spd += 5;
  if (h.physiology === 'superhuman' && (h.physPicks || []).some(p => p.startsWith('Super Speed'))) spd += 5;
  if (h.classId === 'striker' && h.level >= 2) spd += (h.level >= 18 ? 30 : h.level >= 14 ? 25 : h.level >= 10 ? 20 : h.level >= 6 ? 15 : 10);
  if ((h.feats || []).some(f => f.startsWith('Explosive Movement'))) spd += 5;
  return spd;
}

function calcQuirkDC(h) {
  const pb = pbOf(h.level);
  const statKey = h.classId === 'catalyst' ? h.classKeyStat : (h.quirk.stat || 'dex');
  let bonus = 0;
  if (h.classId === 'striker') bonus += (h.level >= 20 ? 3 : h.level >= 11 ? 2 : 1);
  else if (h.classId === 'catalyst') bonus += (h.level >= 11 ? 2 : 1) + (h.spec === 'Control' && h.level >= 5 ? 1 : 0);
  else if (h.classId === 'arsenal') bonus += (h.level >= 11 ? 2 : 1);
  return 8 + pb + mod(h.stats[statKey]) + bonus;
}

function calcEvasionMax(h) {
  if ((h.stats.dex || 10) < 15) return 0;
  const base = (h.physiology === 'superhuman' && (h.physPicks || []).some(p => p.startsWith('Quick Reflexes'))) ? 2 : 1;
  return base + Math.max(0, mod(h.stats.dex));
}

function quirkMovesFromTuple(q) {
  return q[5].split(';').map(s => s.trim()).filter(Boolean).map((seg, i) => {
    const idx = seg.indexOf('(');
    const name = idx > 0 ? seg.slice(0, idx).trim() : (i === 0 ? q[0] : 'Move ' + (i + 1));
    return { id: uid('mv'), name, desc: seg, ult: i === 0 };
  });
}

function buildResourceFromTuple(q) {
  if (!q[6]) return [];
  const [name, cur, max] = q[6].split('|');
  return [{ id: uid('qr'), name, cur: Number(cur), max: Number(max) }];
}

      stats: { str: 8, dex: 13, con: 16, int: 12, wis: 17, cha: 14, tech: 10 },

    }
  };
  const d = defs[key] || defs.hellflame;
  const q = QUIRKS.find(x => x[0] === d.quirkName) || QUIRKS[0];
  const bg = BACKGROUNDS[d.bgName];
  const h = {
    id: uid('hero'),
    heroName: d.heroName, realName: d.realName, level: 1,
    physiology: d.physiology, physPicks: d.physPicks,
    classId: d.classId, classKeyStat: d.classKeyStat, spec: d.spec,
    classRes: 0,
    stats: { ...d.stats },
    saves: { ...d.saves },
    skills: { ...d.skills },
    hp: { cur: 1, max: 1, temp: 0 }, hpBonus: 0,
    acOverride: null,
    quirk: {
      name: q[0], rarity: q[1], type: q[2], stat: d.quirkStat,
      weakness: q[4], inherited: [], strain: 0,
      resources: buildResourceFromTuple(q),
      moves: quirkMovesFromTuple(q)
    },
    combat: { plusUltra: true, evasionUsed: 0, conditions: { bleeding:0, burned:0, freeze:0, shocked:0, concussed:0, queasy:0, exhaustion:0 } },
    feats: d.key === 'erasure' ? ['Always on the Lookout'] : [],
    suit: { tier: 'Basic Super Suit', dr: 2, ac: 1, integrity: 100, maxIntegrity: 100, injectorUsed: false, perks: [] },
    gear: d.gear || [],
    weapons: [{ id: uid('w'), name: 'Tactical Baton', dmg: '1d6 bludgeoning', notes: 'Finesse, Non-lethal' }],
    bg: { name: d.bgName, contact: bg.contacts[0], contactNotes: '', progPts: 0, yen: bg.yen, isPro: bg.isPro, notes: '' }
  };
  h.quirk.moves.forEach(m => m.ult = (m.name.toLowerCase().includes(d.ultName.toLowerCase())));
  if (!h.quirk.moves.some(m => m.ult) && h.quirk.moves.length) h.quirk.moves[0].ult = true;
  h.hp.max = calcAutoHP(h);
  h.hp.cur = h.hp.max;
  return h;
}

// 3. APP STATE & PERSISTENCE
// ============================================================================
let state = {
  heroes: [],
  activeId: null,
  mode: 'sheet', // 'sheet' | 'wizard'
  tab: 'overview',
  diceOpen: false,
  rollMode: 'normal',
  rollLog: [],
  wiz: null
};

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ heroes: state.heroes, activeId: state.activeId }));
  } catch (e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed.heroes) && parsed.heroes.length) {
        state.heroes = parsed.heroes;
        state.activeId = parsed.activeId || parsed.heroes[0].id;
        return;
      }
    }
  } catch (e) {}
  const starter = makePreset('hellflame');
  state.heroes = [starter];
  state.activeId = starter.id;
  saveState();
}

function getHero() {
  return state.heroes.find(h => h.id === state.activeId) || state.heroes[0];
}

function selectHero(id) {
  state.activeId = id;
  state.mode = 'sheet';
  saveState();
  render();
}

function handlePresetSelect(sel) {
  if (!sel.value) return;
  const h = makePreset(sel.value);
  state.heroes.push(h);
  state.activeId = h.id;
  state.mode = 'sheet';
  sel.value = '';
  saveState();
  render();
  toast(`Added ${h.heroName} (${h.quirk.name}) to roster!`, 'yellow');
}

function startWizard() {
  state.wiz = {
    step: 1,
    heroName: '', realName: '', level: 1,
    physiology: 'standard',
    physBonusPicks: ['dex', 'con', 'str', 'wis'],
    physPicks: [],
    quirkMode: 'library', // 'library' | 'custom'
    qSearch: '', qRarity: '', qType: '',
    quirkIdx: 40, // Hellflame default preview
    quirkStat: 'dex',
    inheritedOn: false, inheritedPicks: [],
    customQuirk: { name: '', rarity: 'Uncommon', type: 'Emitter', stat: 'dex', weakness: '', moves: '' },
    classId: 'striker', classKeyStat: 'dex', spec: 'Tempest',
    saves: ['dex', 'con'], classSkills: ['athletics', 'acrobatics', 'insight'],
    statMode: 'array', // 'array' | 'roll' | 'manual'
    pool: [...STANDARD_ARRAY],
    assigned: { str: 4, dex: 0, con: 1, int: 5, wis: 2, cha: 3, tech: 6 },
    manualStats: { str: 12, dex: 15, con: 14, int: 10, wis: 13, cha: 13, tech: 8 },
    bgName: 'Hero Course Student',
    contact: BACKGROUNDS['Hero Course Student'].contacts[0],
    backstory: '',
    ultName: ''
  };
  state.mode = 'wizard';
  render();
}

function wizGetPhysBonuses(w) {
  const p = PHYSIOLOGIES[w.physiology];
  const out = { str:0, dex:0, con:0, int:0, wis:0, cha:0, tech:0 };
  if (p.fixedBonuses) Object.entries(p.fixedBonuses).forEach(([k, v]) => out[k] += v);
  (p.bonusSlots || []).forEach((slot, i) => {
    const pick = w.physBonusPicks[i] || (slot.opts ? slot.opts[0] : ABILITIES[i].key);
    out[pick] = (out[pick] || 0) + slot.val;
  });
  return out;
}

function wizGetBaseStats(w) {
  if (w.statMode === 'manual') return { ...w.manualStats };
  const out = {};
  ABILITIES.forEach((a, i) => {
    const idx = w.assigned[a.key];
    out[a.key] = (idx != null && w.pool[idx] != null) ? w.pool[idx] : 10;
  });
  return out;
}

function wizGetFinalStats(w) {
  const base = wizGetBaseStats(w), bon = wizGetPhysBonuses(w), out = {};
  ABILITIES.forEach(a => out[a.key] = Math.min(20, (base[a.key] || 10) + (bon[a.key] || 0)));
  return out;
}

function renderWizard() {
  const w = state.wiz;
  const labels = ['1. Physiology', '2. Quirk', '3. Class', '4. 7 Stats', '5. Background', '6. Review'];
  let body = '';
  if (w.step === 1) body = renderWizStep1(w);
  else if (w.step === 2) body = renderWizStep2(w);
  else if (w.step === 3) body = renderWizStep3(w);
  else if (w.step === 4) body = renderWizStep4(w);
  else if (w.step === 5) body = renderWizStep5(w);
  else body = renderWizStep6(w);

  return `
    <div class="panel stack">
      <div class="row-between" style="flex-wrap:wrap;">
        <h2 class="hud-font" style="margin:0;color:var(--yellow);">⚡ HERO CREATION WIZARD</h2>
        <button class="btn-sm" onclick="state.mode='sheet';render()">✕ Cancel</button>
      </div>
      <div class="wiz-steps">
        ${labels.map((lb, i) => `<button class="wiz-step ${w.step===i+1?'active':w.step>i+1?'done':''}" onclick="state.wiz.step=${i+1};render()">${lb}</button>`).join('')}
      </div>
      ${body}
      <div class="row-between" style="padding-top:10px;border-top:1px solid var(--border);">
        <button ${w.step===1?'disabled style="opacity:0.4"':''} onclick="state.wiz.step=Math.max(1,state.wiz.step-1);render()">← Back</button>
        ${w.step < 6
          ? `<button class="btn-yellow" onclick="state.wiz.step=Math.min(6,state.wiz.step+1);render()">Next Step →</button>`
          : `<button class="btn-yellow" onclick="finishWizard()">⚡ Finish &amp; Create Hero</button>`}
      </div>
    </div>
  `;
}

function wizSelectPhys(k) {
  const w = state.wiz, p = PHYSIOLOGIES[k];
  w.physiology = k;
  w.physPicks = [];
  w.physBonusPicks = (p.bonusSlots || []).map((slot, i) => slot.opts ? slot.opts[0] : ABILITIES[i].key);
  render();
}

function wizTogglePhysPick(pk) {
  const w = state.wiz, max = PHYSIOLOGIES[w.physiology].pickCount || 1;
  const idx = w.physPicks.indexOf(pk);
  if (idx >= 0) w.physPicks.splice(idx, 1);
  else {
    if (w.physPicks.length >= max) w.physPicks.shift();
    w.physPicks.push(pk);
  }
  render();
}

    if (w.qRarity && item[1] !== w.qRarity) return false;

function wizRollQuirk() {
  const roll = Math.floor(Math.random() * 100) + 1;
  const idx = Math.floor(Math.random() * QUIRKS.length);
  state.wiz.quirkIdx = idx;
  state.wiz.quirkStat = QUIRKS[idx][3].split('/')[0];
  render();
  toast(`d100 rolled ${roll} -> Awoke "${QUIRKS[idx][0]}"!`, 'yellow');
}

function wizToggleInherited(ip) {
  const list = state.wiz.inheritedPicks, i = list.indexOf(ip);
  if (i >= 0) list.splice(i, 1);
  else { if (list.length >= 2) list.shift(); list.push(ip); }
  render();
}

      </div>

}

function wizSelectClass(id) {
  const w = state.wiz, cls = CLASSES[id];

  w.spec = Object.keys(cls.specs)[0];
  w.classSkills = cls.skills.slice(0, 3);
  render();
}
function wizToggleSave(k) {
  const s = state.wiz.saves, i = s.indexOf(k);
  if (i >= 0) s.splice(i, 1);
  else { if (s.length >= 2) s.shift(); s.push(k); }
  render();
}
function wizToggleClassSkill(id) {
  const s = state.wiz.classSkills, i = s.indexOf(id);
  if (i >= 0) s.splice(i, 1);
  else { if (s.length >= 3) s.shift(); s.push(id); }
  render();
}

function renderWizStep4(w) {
  const base = wizGetBaseStats(w), bon = wizGetPhysBonuses(w), fin = wizGetFinalStats(w);
  return `
    <div class="stack">
      <div class="row-between" style="flex-wrap:wrap;">

              : `<select onchange="wizAssignPool('${a.key}',Number(this.value))">
                  ${w.pool.map((v, i) => `<option value="${i}" ${w.assigned[a.key]===i?'selected':''}>${v}</option>`).join('')}
                </select>`}
            <div style="font-size:11px;color:var(--emerald);">Phys: ${fmt(bon[a.key])}</div>
            <div style="font-size:13px;font-weight:800;">Final: ${fin[a.key]}</div>

}

function wizSetStatMode(m) {
  const w = state.wiz;
  w.statMode = m;
  if (m === 'array') w.pool = [...STANDARD_ARRAY];
  else if (m === 'roll') wizRollStats(true);
  render();
}
function wizRollStats(silent) {
  const roll4d6 = () => {
    const r = [1,2,3,4].map(() => Math.floor(Math.random()*6)+1).sort((a,b)=>a-b);
    return r[1]+r[2]+r[3];
  };
  state.wiz.pool = Array.from({length:7}, roll4d6).sort((a,b)=>b-a);
  if (!silent) { render(); toast('Rolled 7 stats: ' + state.wiz.pool.join(', '), 'yellow'); }
}
function wizAssignPool(statKey, newIdx) {
  const w = state.wiz, oldIdx = w.assigned[statKey];
  const swapKey = Object.keys(w.assigned).find(k => w.assigned[k] === newIdx);
  if (swapKey) w.assigned[swapKey] = oldIdx;
  w.assigned[statKey] = newIdx;
  render();
}

function buildHeroFromWizard(w) {
  const stats = wizGetFinalStats(w);
  const bg = BACKGROUNDS[w.bgName];
  const phys = PHYSIOLOGIES[w.physiology];
  const cls = CLASSES[w.classId];
  const isQuirkless = (w.physiology === 'quirkless' || w.physiology === 'quirkless_var');

  let qObj;
  if (isQuirkless) {
    qObj = { name: 'Quirkless', rarity: 'None', type: 'None', stat: w.classKeyStat, weakness: 'No Quirk.', inherited: [], strain: 0, resources: [], moves: [] };
  } else if (w.quirkMode === 'custom') {
    const cq = w.customQuirk;
    const mvs = (cq.moves || 'Custom Move (Action)').split(';').map(s=>s.trim()).filter(Boolean).map((seg,i)=>({ id: uid('mv'), name: seg.split('(')[0].trim() || 'Move '+(i+1), desc: seg, ult: i===0 }));
    qObj = { name: cq.name || 'Custom Quirk', rarity: cq.rarity, type: cq.type, stat: cq.stat, weakness: cq.weakness || 'Custom drawback.', inherited: w.inheritedOn ? [...w.inheritedPicks] : [], strain: 0, resources: [], moves: mvs };
  } else {
    const qt = QUIRKS[w.quirkIdx] || QUIRKS[0];
    qObj = { name: qt[0], rarity: qt[1], type: qt[2], stat: w.quirkStat, weakness: qt[4], inherited: w.inheritedOn ? [...w.inheritedPicks] : [], strain: 0, resources: buildResourceFromTuple(qt), moves: quirkMovesFromTuple(qt) };
  }

  if (w.ultName.trim()) {
    const match = qObj.moves.find(m => m.name.toLowerCase() === w.ultName.trim().toLowerCase());
    if (match) { qObj.moves.forEach(m => m.ult = false); match.ult = true; }
    else { qObj.moves.forEach(m => m.ult = false); qObj.moves.unshift({ id: uid('mv'), name: w.ultName.trim(), desc: 'Designated Ultimate Move (+1 dmg die, +10ft range/area, +2 rds duration).', ult: true }); }
  }

  const skills = {};
  w.classSkills.forEach(s => skills[s] = 1);
  bg.skills.forEach(s => skills[s] = Math.max(skills[s]||0, 1));
  (phys.autoExpSkills || []).forEach(s => skills[s] = 2);
  if (phys.autoExpStats) SKILLS.filter(sk => phys.autoExpStats.includes(sk.stat)).forEach(sk => skills[sk.id] = 2);

  const saves = {};
  w.saves.forEach(k => saves[k] = true);

  const h = {
    id: uid('hero'),
    heroName: w.heroName.trim() || (qObj.name !== 'Quirkless' ? qObj.name + ' Hero' : 'Unnamed Hero'),
    realName: w.realName.trim() || 'Student',
    level: w.level,
    physiology: w.physiology, physPicks: [...w.physPicks],
    classId: w.classId, classKeyStat: w.classKeyStat, spec: w.spec,
    classRes: cls.resMax(w.level, mod(stats.tech), w.classKeyStat),
    stats, saves, skills,
    hp: { cur: 1, max: 1, temp: 0 }, hpBonus: 0, acOverride: null,
    quirk: qObj,
    combat: { plusUltra: true, evasionUsed: 0, conditions: { bleeding:0, burned:0, freeze:0, shocked:0, concussed:0, queasy:0, exhaustion:0 } },
    feats: [],
    suit: { tier: 'Basic Super Suit', dr: 2, ac: 1, integrity: 100, maxIntegrity: 100, injectorUsed: false, perks: [] },
    gear: [{ id: uid('g'), name: 'Utility Belt & Comms', active: true, notes: 'Built into Basic Super Suit (2 mi comms, Tracker ID, Emergency Injector 1d10).' }],
    weapons: [{ id: uid('w'), name: 'Starting Weapon', dmg: '1d6 bludgeoning', notes: 'From class loadout' }],
    bg: { name: w.bgName, contact: w.contact, contactNotes: '', progPts: 0, yen: bg.yen, isPro: bg.isPro, notes: w.backstory }
  };
  h.hp.max = calcAutoHP(h);
  h.hp.cur = h.hp.max;
  return h;
}

  return `

  const h = buildHeroFromWizard(state.wiz);

          <div class="grid g-4" style="gap:8px;">

              <div class="label">AC</div>

// ============================================================================
// 6. SHEET MUTATIONS & MODALS
// ============================================================================
function updateHero(k, v) { const h = getHero(); h[k] = v; h.hp.max = calcAutoHP(h); saveState(); render(); }
function updateBg(k, v) { const h = getHero(); h.bg[k] = v; saveState(); render(); }
function updateSuit(k, v) { const h = getHero(); h.suit[k] = v; saveState(); render(); }
function updateStat(k, v) { const h = getHero(); h.stats[k] = Math.max(1, Math.min(30, Number(v)||10)); h.hp.max = calcAutoHP(h); saveState(); render(); }
function toggleSave(k) { const h = getHero(); h.saves[k] = !h.saves[k]; saveState(); render(); }
function cycleSkill(id) { const h = getHero(); h.skills[id] = ((h.skills[id]||0)+1)%3; saveState(); render(); }
function togglePlusUltra() { const h = getHero(); h.combat.plusUltra = !h.combat.plusUltra; saveState(); render(); }
function adjEvasion(d) { const h = getHero(); h.combat.evasionUsed = Math.max(0, Math.min(calcEvasionMax(h), (h.combat.evasionUsed||0)+d)); saveState(); render(); }
function setACOverride(val) { const h = getHero(); const n = Number(val); h.acOverride = (!val || n === calcAutoAC(h)) ? null : n; saveState(); render(); }
function modHP(dir) {
  const h = getHero(), amt = Math.max(1, Number(document.getElementById('hpDelta')?.value)||1);
  if (dir < 0) {
    let rem = amt;
    if (h.hp.temp > 0) { const a = Math.min(h.hp.temp, rem); h.hp.temp -= a; rem -= a; }
    h.hp.cur = Math.max(0, h.hp.cur - rem);
  } else h.hp.cur = Math.min(h.hp.max, h.hp.cur + amt);
  saveState(); render();
}
function setTempHP() {
  const h = getHero(), amt = Math.max(0, Number(document.getElementById('hpDelta')?.value)||0);
  h.hp.temp = Math.max(h.hp.temp||0, amt);
  saveState(); render();
}
function doRest(type) {
  const h = getHero(), cls = CLASSES[h.classId];
  const maxRes = cls.resMax(h.level, mod(h.stats.tech), h.classKeyStat);
  if (type === 'short') {
    if (h.classId !== 'catalyst') h.classRes = maxRes;
    else if (h.level >= 13) h.classRes = Math.min(maxRes, h.classRes + Math.floor(h.level/2));
    toast('Short Rest complete!');
  } else if (type === 'long') {
    h.hp.cur = Math.min(h.hp.max, h.hp.cur + Math.ceil(h.hp.max/2));
    h.classRes = maxRes; h.combat.evasionUsed = 0; h.quirk.strain = 0;
    toast('Long Rest complete (+50% HP, resources refreshed).', 'yellow');
  } else {
    h.hp.cur = h.hp.max; h.classRes = maxRes; h.combat.evasionUsed = 0; h.quirk.strain = 0;
    h.combat.conditions.bleeding = 0; h.combat.conditions.queasy = 0;
    toast('Full 24h Rest complete! Full HP & conditions cleared.', 'yellow');
  }
  saveState(); render();
}
function adjStrain(d) {
  const h = getHero();
  h.quirk.strain = Math.max(0, Math.min(15, (h.quirk.strain||0)+d));
  if (h.quirk.strain >= 15) toast('Strain hit 15 — Concentration lost! Reset Strain to 0.', 'crimson');
  saveState(); render();
}
function setStrain(v) { const h = getHero(); h.quirk.strain = v; saveState(); render(); }
function rollControlCheck() {
  const h = getHero(), st = h.quirk.stat || 'dex', dc = 8 + (h.quirk.strain||0);
  const prev = state.rollMode;
  if ((h.quirk.strain||0) >= 10) state.rollMode = 'disadv';
  rollD20(`Quirk Control (DC ${dc})`, mod(h.stats[st]));
  state.rollMode = prev;
}
function adjQRes(id, d) { const h = getHero(), r = h.quirk.resources.find(x=>x.id===id); if(!r)return; r.cur = Math.max(0, Math.min(r.max, r.cur+d)); saveState(); render(); }
function delQRes(id) { const h = getHero(); h.quirk.resources = h.quirk.resources.filter(x=>x.id!==id); saveState(); render(); }
function starUltimate(id) { const h = getHero(); h.quirk.moves.forEach(m => m.ult = (m.id===id ? !m.ult : false)); saveState(); render(); }
function delMove(id) { const h = getHero(); h.quirk.moves = h.quirk.moves.filter(m=>m.id!==id); saveState(); render(); }
function adjCond(id, d) { const h = getHero(), c = CONDITIONS.find(x=>x.id===id); h.combat.conditions[id] = Math.max(0, Math.min(c.max, (h.combat.conditions[id]||0)+d)); saveState(); render(); }
function clearConds() { const h = getHero(); CONDITIONS.forEach(c=>h.combat.conditions[c.id]=0); saveState(); render(); }
function adjClassRes(d) { const h = getHero(), m = CLASSES[h.classId].resMax(h.level, mod(h.stats.tech), h.classKeyStat); h.classRes = Math.max(0, Math.min(m, (h.classRes||0)+d)); saveState(); render(); }
function setClassRes(v) { const h = getHero(); h.classRes = v; saveState(); render(); }
function resetClassRes() { const h = getHero(); h.classRes = CLASSES[h.classId].resMax(h.level, mod(h.stats.tech), h.classKeyStat); saveState(); render(); }
function removeFeat(f) { const h = getHero(); h.feats = (h.feats||[]).filter(x=>x!==f); h.hp.max = calcAutoHP(h); saveState(); render(); }
function applySuitHit() {
  const h = getHero(), dmg = Math.max(1, Number(document.getElementById('suitHitDmg')?.value)||1);
  const s = h.suit;
  const effDR = Math.max(0, (Number(s.dr)||0) - (s.integrity<=50?2:0)) + (h.classId==='arsenal'?CLASSES.arsenal.suitDR(h.level):0);
  const prevented = Math.min(dmg, effDR), through = Math.max(0, dmg - prevented);
  const loss = prevented + Math.ceil(through / 2);
  s.integrity = Math.max(0, s.integrity - loss);
  toast(`Suit blocked ${prevented}, ${through} went through -> -${loss} Integrity.`, 'yellow');
  saveState(); render();
}
function repairSuit(amt) { const h = getHero(); h.suit.integrity = Math.min(h.suit.maxIntegrity, h.suit.integrity + amt); saveState(); render(); }
function useInjector() {
  const h = getHero();
  if (h.suit.injectorUsed) { h.suit.injectorUsed = false; toast('Emergency Injector restocked.'); }
  else { h.suit.injectorUsed = true; rollFormula('1d10', 'Emergency Injector Heal'); }
  saveState(); render();
}
function toggleGear(id) {
  const h = getHero(), g = h.gear.find(x=>x.id===id); if (!g) return;
  const cap = h.bg.isPro ? 4 : 3;
  if (!g.active && h.gear.filter(x=>x.active).length >= cap) { toast(`Active gear limit (${cap}) reached!`, 'crimson'); return; }
  g.active = !g.active; saveState(); render();
}
function delGear(id) { const h = getHero(); h.gear = h.gear.filter(x=>x.id!==id); saveState(); render(); }
function delWeapon(id) { const h = getHero(); h.weapons = h.weapons.filter(x=>x.id!==id); saveState(); render(); }
function changeBg(nm) { const h = getHero(), b = BACKGROUNDS[nm]; h.bg.name = nm; h.bg.isPro = b.isPro; h.bg.contact = b.contacts[0]; saveState(); render(); }
function rollContact() { const h = getHero(), cs = BACKGROUNDS[h.bg.name].contacts; const r = Math.floor(Math.random()*cs.length); h.bg.contact = cs[r]; toast(`Contact d6 rolled ${r+1}: ${cs[r]}`); saveState(); render(); }

// MODALS
function openModal(html) { document.getElementById('modalBox').innerHTML = html; document.getElementById('modalBackdrop').classList.remove('hidden'); }
function closeModal() { document.getElementById('modalBackdrop').classList.add('hidden'); }

function openEditIdentityModal() {
  const h = getHero();
  openModal(`
    <div class="row-between"><strong class="hud-font" style="color:var(--yellow);">✎ EDIT HERO INFO</strong><button class="btn-xs" onclick="closeModal()">✕</button></div>
    <div class="grid g-2">
      <div><label class="label">Hero Name</label><input id="edHName" type="text" value="${esc(h.heroName)}" /></div>
      <div><label class="label">Real Name</label><input id="edRName" type="text" value="${esc(h.realName)}" /></div>
    </div>
    <div class="row" style="justify-content:flex-end;"><button class="btn-yellow" onclick="saveIdentity()">Save</button></div>
  `);
}
function saveIdentity() {
  const h = getHero();
  h.heroName = document.getElementById('edHName').value.trim() || h.heroName;
  h.realName = document.getElementById('edRName').value.trim() || h.realName;
  saveState(); closeModal(); render();
}

function openLevelUpModal() {
  const h = getHero(), cls = CLASSES[h.classId];
  if (!h) return;
  const nextLv = Math.min(20, h.level + 1);
  openModal(`
    <div class="row-between"><strong class="hud-font" style="color:var(--emerald);">⬆ LEVEL UP HELPER</strong><button class="btn-xs" onclick="closeModal()">✕</button></div>
    <div class="subcard stack-sm">
      <div class="row-between"><span>Current Level: <strong>${h.level}</strong></span><span>New Level: <input id="lvlVal" type="number" min="1" max="20" value="${nextLv}" style="width:68px;text-align:center;font-weight:800;" /></span></div>
      <div style="font-size:12px;color:var(--muted);">Hit Die: d${cls.hitDie} (avg ${cls.avgHit}) + CON (${fmt(mod(h.stats.con))}). Auto-updates Proficiency Bonus (+2 to +6), Improved Durability milestones, and ${cls.resName}.</div>
      <div class="row-wrap">
        <button class="btn-emerald" onclick="applyLevelUp(false)">Apply Level (Average HP)</button>
        <button class="btn-cyan" onclick="applyLevelUp(true)">🎲 Roll d${cls.hitDie} &amp; Level Up (+1)</button>
      </div>
    </div>
  `);
}
function applyLevelUp(rolled) {
  const h = getHero(), cls = CLASSES[h.classId];
  const oldMax = h.hp.max;
  if (rolled && h.level < 20) {
    const r = Math.floor(Math.random() * cls.hitDie) + 1;
    h.level += 1;
    h.hpBonus = (h.hpBonus || 0) + (r - cls.avgHit);
    toast(`Rolled ${r} on d${cls.hitDie}! Reached Level ${h.level}.`, 'yellow');
  } else {
    h.level = Math.max(1, Math.min(20, Number(document.getElementById('lvlVal').value) || h.level));
    toast(`${h.heroName} is now Level ${h.level}!`, 'yellow');
  }
  h.hp.max = calcAutoHP(h);
  if (h.hp.max > oldMax) h.hp.cur = Math.min(h.hp.max, h.hp.cur + (h.hp.max - oldMax));
  else h.hp.cur = Math.min(h.hp.cur, h.hp.max);
  h.classRes = cls.resMax(h.level, mod(h.stats.tech), h.classKeyStat);
  saveState(); closeModal(); render();
}

function openQuirkSwapModal() {
  openModal(`
    <div class="row-between"><strong class="hud-font" style="color:var(--yellow);">🔄 SWAP QUIRK (${QUIRKS.length} COMPENDIUM)</strong><button class="btn-xs" onclick="closeModal()">✕</button></div>
    <input id="qsInp" type="text" placeholder="Search any Quirk..." oninput="filterQuirkSwap()" />
    <div id="qsList" class="grid g-2 scroll-box" style="max-height:360px;gap:6px;"></div>
  `);
  filterQuirkSwap();
}
function filterQuirkSwap() {
  const s = (document.getElementById('qsInp')?.value || '').toLowerCase();
  const list = QUIRKS.map((q,i)=>({q,i})).filter(({q}) => !s || (q[0]+' '+q[1]+' '+q[2]).toLowerCase().includes(s));
  document.getElementById('qsList').innerHTML = list.map(({q,i}) => `
    <button class="select-card" style="padding:7px 9px;" onclick="swapQuirk(${i})">
      <strong style="font-size:12px;">${esc(q[0])}</strong> <span class="pill" style="font-size:9px;">${q[1]}</span>
      <div style="font-size:10px;color:var(--cyan);">${q[2]} • ${q[3].toUpperCase()}</div>
    </button>
  `).join('');
}
function swapQuirk(idx) {
  const h = getHero(), q = QUIRKS[idx];
  h.quirk = { name:q[0], rarity:q[1], type:q[2], stat:q[3].split('/')[0], weakness:q[4], inherited:[], strain:0, resources:buildResourceFromTuple(q), moves:quirkMovesFromTuple(q) };
  h.hp.max = calcAutoHP(h);
  saveState(); closeModal(); render(); toast(`Swapped Quirk to ${q[0]}!`, 'yellow');
}

function openMoveModal(editId) {
  const h = getHero(), m = editId ? h.quirk.moves.find(x=>x.id===editId) : { name:'', desc:'' };
  openModal(`
    <div class="row-between"><strong class="hud-font" style="color:var(--yellow);">${editId?'EDIT':'ADD'} QUIRK MOVE</strong><button class="btn-xs" onclick="closeModal()">✕</button></div>
    <div><label class="label">Move Name</label><input id="mvNm" type="text" value="${esc(m.name)}" /></div>
    <div><label class="label">Effect &amp; Dice (e.g. Act, 4d10 fire)</label><textarea id="mvDs" rows="3">${esc(m.desc)}</textarea></div>
    <div class="row" style="justify-content:flex-end;"><button class="btn-yellow" onclick="saveMove('${editId||''}')">Save Move</button></div>
  `);
}
function saveMove(editId) {
  const h = getHero(), nm = document.getElementById('mvNm').value.trim(); if (!nm) return;
  const ds = document.getElementById('mvDs').value.trim();
  if (editId) { const m = h.quirk.moves.find(x=>x.id===editId); if (m) { m.name = nm; m.desc = ds; } }
  else h.quirk.moves.push({ id: uid('mv'), name: nm, desc: ds, ult: false });
  saveState(); closeModal(); render();
}

function openResModal(editId) {
  const h = getHero(), r = editId ? h.quirk.resources.find(x=>x.id===editId) : { name:'', cur:0, max:10 };
  openModal(`
    <div class="row-between"><strong class="hud-font" style="color:var(--cyan);">${editId?'EDIT':'ADD'} QUIRK METER</strong><button class="btn-xs" onclick="closeModal()">✕</button></div>
    <div class="grid g-3">
      <div><label class="label">Name</label><input id="rmNm" type="text" value="${esc(r.name)}" placeholder="Heat Points" /></div>
      <div><label class="label">Current</label><input id="rmCur" type="number" value="${r.cur}" /></div>

    </div>
    <div class="row" style="justify-content:flex-end;"><button class="btn-cyan" onclick="saveRes('${editId||''}')">Save Meter</button></div>
  `);
}
function saveRes(editId) {
  const h = getHero(), nm = document.getElementById('rmNm').value.trim(); if (!nm) return;

  saveState(); closeModal(); render();

function openFeatModal() {
  const h = getHero();
  openModal(`
    <div class="row-between"><strong class="hud-font" style="color:var(--emerald);">🏅 ADD MHA5E FEAT</strong><button class="btn-xs" onclick="closeModal()">✕</button></div>
    <div class="stack-sm scroll-box" style="max-height:360px;">
      ${FEATS_LIST.map(([nm, ds]) => {

          <div style="font-size:11px;color:var(--muted);">${esc(ds)}</div>
        </button>`;

}
function toggleFeat(nm) {

  const i = h.feats.indexOf(nm);
  if (i >= 0) h.feats.splice(i, 1); else h.feats.push(nm);

function openSuitPerksModal() {

function openAddGearModal() {

    <div><label class="label">Item Name</label><input id="agNm" type="text" placeholder="e.g. Capturing Scarf, Grenadier Bracers" /></div>

}

function openAddWeaponModal() {
  openModal(`
    <div class="row-between"><strong class="hud-font" style="color:var(--crimson);">+ ADD WEAPON</strong><button class="btn-xs" onclick="closeModal()">✕</button></div>
    <div class="grid g-2">
      <div><label class="label">Weapon Name</label><input id="awNm" type="text" placeholder="e.g. Katana, Frag Grenade" /></div>
      <div><label class="label">Damage</label><input id="awDg" type="text" placeholder="e.g. 2d6 slashing" /></div>

function exportJSON() {
  const blob = new Blob([JSON.stringify({ heroes: state.heroes, activeId: state.activeId }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'mha5e_roster_v2.json'; a.click();
  toast('Exported mha5e_roster_v2.json!', 'yellow');
}
function openImportModal() {
  openModal(`
    <div class="row-between"><strong class="hud-font" style="color:var(--cyan);">⬆ IMPORT ROSTER JSON</strong><button class="btn-xs" onclick="closeModal()">✕</button></div>
    <textarea id="impTxt" rows="7" placeholder="Paste exported MHA5e JSON here..."></textarea>
    <div class="row" style="justify-content:flex-end;"><button class="btn-cyan" onclick="runImport()">Import</button></div>
  `);
}
function runImport() {
  try {
    const d = JSON.parse(document.getElementById('impTxt').value);
    if (!Array.isArray(d.heroes) || !d.heroes.length) throw new Error();
    state.heroes = d.heroes; state.activeId = d.activeId || d.heroes[0].id; state.mode = 'sheet';
    saveState(); closeModal(); render(); toast('Roster imported!', 'yellow');
  } catch (e) { toast('Invalid JSON file.', 'crimson'); }
}
function openDeleteModal() {
  if (state.heroes.length <= 1) { toast('Keep at least 1 hero in your roster.', 'crimson'); return; }
  const h = getHero();
  openModal(`
    <div class="row-between"><strong class="hud-font" style="color:var(--crimson);">🗑 DELETE HERO</strong><button class="btn-xs" onclick="closeModal()">✕</button></div>
    <p>Delete <strong>${esc(h.heroName)}</strong> from your saved roster?</p>
    <div class="row" style="justify-content:flex-end;">
      <button onclick="closeModal()">Cancel</button>
      <button class="btn-crimson" onclick="confirmDelete()">Delete</button>
    </div>
  `);
}
function confirmDelete() {
  state.heroes = state.heroes.filter(x => x.id !== state.activeId);
  state.activeId = state.heroes[0].id;
  saveState(); closeModal(); render(); toast('Hero removed.');
}

// ============================================================================
// 7. DICE TRAY ENGINE & RENDER LOOP
// ============================================================================
function linkDice(text) {
  return esc(text).replace(/\b(\d+d\d+(?:\s*[+-]\s*\d+)?)\b/gi, m => `<button class="dice-link" onclick="rollFormula('${m.replace(/\s+/g,'')}','${m}')">${m}</button>`);
}
function toggleDiceDrawer() { state.diceOpen = !state.diceOpen; renderDiceDrawer(); }
function setRollMode(m) { state.rollMode = m; renderDiceDrawer(); }
function clearRollLog() { state.rollLog = []; renderDiceDrawer(); }
function getDrawerMod() { return Number(document.getElementById('diceModInput')?.value) || 0; }
function quickDie(sides) {
  const m = getDrawerMod(), r = Math.floor(Math.random()*sides)+1;
  logRoll(`1d${sides}`, [r], m, r + m, '');
}
function quickD20() { rollD20('d20 Roll', getDrawerMod()); }
function rollD20(label, bonus=0) {
  const m = state.rollMode, cnt = m === 'normal' ? 1 : 2;
  const rolls = Array.from({length:cnt}, () => Math.floor(Math.random()*20)+1);
  const kept = m === 'disadv' ? Math.min(...rolls) : Math.max(...rolls);
  const tag = (kept===20?'NAT 20! ':kept===1?'NAT 1! ':'') + (m!=='normal'?m.toUpperCase():'');
  logRoll(label, rolls, bonus, kept + bonus, tag);
}
function rollPlusUltra() {
  const b = getDrawerMod();
  const rolls = [1,2,3].map(() => Math.floor(Math.random()*20)+1);
  const kept = Math.max(...rolls);
  logRoll('PLUS ULTRA (3d20kh1)', rolls, b, kept + b, kept===20?'NAT 20!':'Kept Highest');
}
function rollClash() {
  const r = Math.floor(Math.random()*100)+1;
  logRoll('CLASH (d100)', [r], 0, r, `Win +${Math.floor(r/2)} / Lose +${Math.floor(r/4)}`);
}
function rollFormula(expr, label) {
  const clean = String(expr||'').replace(/\s+/g,'').toLowerCase();
  const m = clean.match(/^(\d*)d(\d+)([+-]\d+)?$/);
  if (!m) { toast('Use format like 3d6+2 or 4d10', 'crimson'); return; }
  const cnt = Math.min(50, Math.max(1, Number(m[1]||1))), sides = Math.min(1000, Math.max(2, Number(m[2]))), bonus = Number(m[3]||0);
  const rolls = Array.from({length:cnt}, () => Math.floor(Math.random()*sides)+1);
  logRoll(label || clean, rolls, bonus, rolls.reduce((a,b)=>a+b,0) + bonus, '');
}
function runCustomFormula() {
  const v = document.getElementById('diceFormulaInput')?.value.trim();
  if (v) rollFormula(v, v);
}
function logRoll(label, rolls, bonus, total, note) {
  state.rollLog.unshift({ label, rolls, bonus, total, note });
  if (state.rollLog.length > 30) state.rollLog.pop();
  state.diceOpen = true;
  renderDiceDrawer();
}
function renderDiceDrawer() {
  document.getElementById('diceDrawer').classList.toggle('open', state.diceOpen);
  document.querySelectorAll('[data-rm]').forEach(b => {
    b.className = 'btn-xs ' + (b.getAttribute('data-rm') === state.rollMode ? 'btn-cyan' : '');
  });
  const pill = document.getElementById('navLastRoll');
  if (state.rollLog.length) { pill.classList.remove('hidden'); pill.textContent = state.rollLog[0].total; }
  else pill.classList.add('hidden');
  document.getElementById('diceLog').innerHTML = state.rollLog.length
    ? state.rollLog.map(r => `<div class="subcard" style="padding:7px 9px;">
        <div class="row-between"><strong style="font-size:12px;color:var(--cyan);">${esc(r.label)}</strong><strong style="font-size:17px;color:var(--yellow);">${r.total}</strong></div>
        <div style="font-size:11px;color:var(--muted);">[${r.rolls.join(', ')}]${r.bonus?' '+fmt(r.bonus):''} ${r.note?`<span style="color:var(--yellow);">• ${esc(r.note)}</span>`:''}</div>
      </div>`).join('')
    : '<div style="text-align:center;color:var(--dim);font-size:12px;padding:16px;">Click any stat, skill, or dice button to roll!</div>';
}

function toast(msg, cls='') {
  const w = document.getElementById('toastWrap');
  const d = document.createElement('div');
  d.className = 'toast ' + cls;
  d.textContent = msg;
  w.appendChild(d);
  setTimeout(() => d.remove(), 3200);
}

function render() {
  const sel = document.getElementById('heroSelector');
  sel.innerHTML = state.heroes.map(h => `<option value="${h.id}" ${h.id===state.activeId?'selected':''}>${esc(h.heroName)} (Lv ${h.level} ${esc(h.quirk.name)})</option>`).join('');
  document.getElementById('appRoot').innerHTML = state.mode === 'wizard' ? renderWizard() : renderSheet();
  renderDiceDrawer();
}

window.onload = function () {
  loadState();
  render();
};
</script>
