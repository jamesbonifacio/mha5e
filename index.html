<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MHA5e — My Hero Academia 5e Character Creator & Tracker</title>
<style>
  :root {
    --bg: #080d18;
    --bg2: #0f172a;
    --card: #131e33;
    --card2: #192640;
    --border: #263656;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --dim: #64748b;
    --crimson: #ef4444;
    --crimson-bg: rgba(239,68,68,.15);
    --gold: #f59e0b;
    --gold-bg: rgba(245,158,11,.15);
    --cyan: #06b6d4;
    --cyan-bg: rgba(6,182,212,.15);
    --emerald: #10b981;
    --emerald-bg: rgba(16,185,129,.15);
    --purple: #a855f7;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45; min-height: 100vh; overflow-x: hidden;
  }
  .hud-font { font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; letter-spacing: .04em; font-weight: 800; }
  button {
    font: inherit; color: var(--text); background: var(--card2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: 600; font-size: 13px;
    transition: background .15s, border-color .15s, transform .08s; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  button:hover { background: #223354; border-color: #3b527e; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .btn-sm { padding: 5px 9px; font-size: 12px; border-radius: 7px; }
  .btn-xs { padding: 3px 7px; font-size: 11px; border-radius: 6px; }
  .btn-crimson { background: var(--crimson); border-color: #f87171; color: #fff; }
  .btn-crimson:hover { background: #dc2626; }
  .btn-gold { background: var(--gold); border-color: #fbbf24; color: #0b101b; }
  .btn-gold:hover { background: #d97706; }
  .btn-cyan { background: var(--cyan); border-color: #22d3ee; color: #06131c; }
  .btn-cyan:hover { background: #0891b2; color: #fff; }
  .btn-emerald { background: var(--emerald); border-color: #34d399; color: #052015; }
  .btn-emerald:hover { background: #059669; color: #fff; }
  .btn-ghost { background: transparent; border-color: var(--border); }
  input, select, textarea {
    font: inherit; color: var(--text); background: var(--bg2); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; font-size: 13px; width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--cyan); }
  label.lbl { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
  .hidden { display: none !important; }

  /* Layout */
  .topbar {
    position: sticky; top: 0; z-index: 40; background: rgba(11,16,27,.94); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border); padding: 10px 14px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-badge {
    background: linear-gradient(135deg, var(--crimson), var(--gold)); color: #090d16;
    font-weight: 900; font-size: 14px; padding: 5px 9px; border-radius: 8px;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 14px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .subcard { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .row-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .stack-sm { display: flex; flex-direction: column; gap: 7px; }
  .grid { display: grid; gap: 12px; }
  .g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .g-7 { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .g-12 { grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .col-4 { grid-column: span 4; }
  .col-5 { grid-column: span 5; }
  .col-6 { grid-column: span 6; }
  .col-7 { grid-column: span 7; }
  .col-8 { grid-column: span 8; }
  @media (max-width: 960px) {
    .col-4, .col-5, .col-6, .col-7, .col-8 { grid-column: span 12; }
    .g-7 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .g-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 600px) {
    .g-2, .g-3 { grid-template-columns: 1fr; }
    .g-7 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  /* Pills, Bars, Cards */
  .pill {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 700; background: var(--card2); border: 1px solid var(--border); color: var(--muted);
  }
  .pill-crimson { background: var(--crimson-bg); border-color: rgba(239,68,68,.45); color: #fca5a5; }
  .pill-gold { background: var(--gold-bg); border-color: rgba(245,158,11,.45); color: #fcd34d; }
  .pill-cyan { background: var(--cyan-bg); border-color: rgba(6,182,212,.45); color: #67e8f9; }
  .pill-emerald { background: var(--emerald-bg); border-color: rgba(16,185,129,.45); color: #6ee7b7; }
  .pill-purple { background: rgba(168,85,247,.16); border-color: rgba(168,85,247,.45); color: #d8b4fe; }

  .bar { width: 100%; height: 10px; background: #070b14; border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
  .bar-fill { height: 100%; transition: width .2s; }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 14px; }
  .tab-btn { background: var(--bg2); color: var(--muted); }
  .tab-btn.active { background: var(--cyan); color: #06131c; border-color: #22d3ee; }

  .select-card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 9px; padding: 10px;
    cursor: pointer; text-align: left; transition: border-color .15s, background .15s; width: 100%; display: block;
  }
  .select-card:hover { border-color: #476294; background: #152138; }
  .select-card.selected { border-color: var(--cyan); background: rgba(6,182,212,.12); box-shadow: 0 0 0 1px var(--cyan) inset; }

  .stat-card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 8px;
    text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .stat-mod {
    font-size: 22px; font-weight: 900; color: var(--cyan); cursor: pointer; padding: 2px 10px;
    border-radius: 8px; background: var(--cyan-bg); border: 1px solid rgba(6,182,212,.35);
  }
  .stat-mod:hover { background: var(--cyan); color: #06131c; }

  .scroll-box { max-height: 400px; overflow-y: auto; padding-right: 4px; }
  .scroll-box::-webkit-scrollbar { width: 6px; }
  .scroll-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

  .banner {
    padding: 10px 14px; border-radius: 9px; border: 1px solid var(--gold);
    background: linear-gradient(90deg, rgba(245,158,11,.18), rgba(6,182,212,.12));
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  }
  .step-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .step-pill {
    padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 700;
    background: var(--bg2); border: 1px solid var(--border); color: var(--muted); cursor: pointer;
  }
  .step-pill.active { background: var(--gold); color: #0b101b; border-color: #fbbf24; }
  .step-pill.done { border-color: var(--emerald); color: var(--emerald); }

  /* Pip buttons */
  .pip { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); cursor: pointer; padding: 0; }
  .pip.filled { background: var(--cyan); border-color: #67e8f9; }

  /* Slide-over Dice Tray */
  .dice-drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 340px; max-width: 94vw; z-index: 60;
    background: #0d1526; border-left: 1px solid var(--border); box-shadow: -10px 0 35px rgba(0,0,0,.6);
    transform: translateX(100%); transition: transform .22s ease; display: flex; flex-direction: column;
  }
  .dice-drawer.open { transform: translateX(0); }

  /* Modal & Toast */
  .modal-bg {
    position: fixed; inset: 0; z-index: 70; background: rgba(4,7,14,.78); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; padding: 14px;
  }
  .modal-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    width: 560px; max-width: 100%; max-height: 88vh; overflow-y: auto; padding: 16px;
  }
  .toast-wrap { position: fixed; bottom: 16px; left: 16px; z-index: 80; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast {
    background: var(--card2); border: 1px solid var(--cyan); color: var(--text);
    padding: 9px 14px; border-radius: 9px; font-size: 13px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.45);
  }
  .toast.gold { border-color: var(--gold); }
  .toast.err { border-color: var(--crimson); }
  .dice-link {
    background: rgba(245,158,11,.15); border: 1px solid rgba(245,158,11,.45); color: #fcd34d;
    padding: 1px 6px; border-radius: 5px; font-size: 11px; font-weight: 700; cursor: pointer;
  }
  .dice-link:hover { background: var(--gold); color: #090d16; }
  details summary { cursor: pointer; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
</style>
</head>
<body>

<!-- TOP HERO AGENCY HUD BAR -->
<header class="topbar">
  <div class="brand">
    <span class="brand-badge hud-font">MHA5e</span>
    <div>
      <div class="hud-font" style="font-size:15px;line-height:1.1;">HERO AGENCY HUD</div>
      <div style="font-size:11px;color:var(--muted);">Character Creator &amp; Campaign Tracker</div>
    </div>
  </div>
  <div class="row-wrap" id="topControls"></div>
</header>

<!-- MAIN VIEWPORT -->
<main class="wrap" id="appRoot"></main>

<!-- SLIDE-OVER DICE TRAY -->
<aside class="dice-drawer" id="diceDrawer">
  <div class="row-between" style="padding:12px 14px;border-bottom:1px solid var(--border);background:var(--bg2);">
    <span class="hud-font" style="color:var(--gold);font-size:15px;">🎲 AGENCY DICE TRAY</span>
    <button class="btn-xs" onclick="toggleDiceDrawer()">✕ Close</button>
  </div>
  <div class="stack" style="padding:12px;overflow-y:auto;flex:1;">
    <div>
      <label class="lbl">Roll Mode (d20 / Special)</label>
      <div class="row-wrap" id="diceModeBar" style="gap:5px;"></div>
    </div>
    <div>
      <label class="lbl">Quick Dice (Including d156 Quirk Die)</label>
      <div class="grid g-4" style="gap:6px;">
        <button class="btn-sm" onclick="rollDie(4)">d4</button>
        <button class="btn-sm" onclick="rollDie(6)">d6</button>
        <button class="btn-sm" onclick="rollDie(8)">d8</button>
        <button class="btn-sm" onclick="rollDie(10)">d10</button>
        <button class="btn-sm" onclick="rollDie(12)">d12</button>
        <button class="btn-sm btn-cyan" onclick="rollD20('d20 Roll', getDiceMod())">d20</button>
        <button class="btn-sm btn-crimson" onclick="rollClash()">d100</button>
        <button class="btn-sm btn-gold" onclick="rollD156Tray()">d156</button>
      </div>
    </div>
    <div class="grid g-2" style="gap:8px;">
      <div>
        <label class="lbl">Flat Modifier</label>
        <input id="diceModInput" type="number" value="0" />
      </div>
      <div>
        <label class="lbl">Custom Formula</label>
        <div class="row" style="gap:4px;">
          <input id="diceFormulaInput" type="text" placeholder="3d6+4" onkeydown="if(event.key==='Enter')runCustomFormula()" />
          <button class="btn-sm btn-gold" onclick="runCustomFormula()">Go</button>
        </div>
      </div>
    </div>
    <div class="row-between">
      <label class="lbl" style="margin:0;">Roll History</label>
      <button class="btn-xs" onclick="clearRollLog()">Clear</button>
    </div>
    <div id="diceLog" class="stack-sm" style="flex:1;"></div>
  </div>
</aside>

<!-- MODAL BACKDROP -->
<div class="modal-bg hidden" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal-card stack" id="modalCard"></div>
</div>

<!-- TOASTS -->
<div class="toast-wrap" id="toastWrap"></div>

const mod = v => Math.floor(((Number(v)||10) - 10) / 2);
const fmt = n => (n >= 0 ? '+' + n : '' + n);
const pbOf = l => l >= 17 ? 6 : l >= 13 ? 5 : l >= 9 ? 4 : l >= 5 ? 3 : 2;
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function calcMaxHP(h) {
  const c = CLASSES[h.classId] || CLASSES.striker;
  const cm = mod(h.stats.con);
  let hp = (c.hpBase + cm) + Math.max(0, h.level - 1) * (c.hpAvg + cm);
  const durCount = c.durLvls.filter(x => x <= h.level).length;
  hp += durCount * Math.max(1, c.durBase + Math.floor(cm / 2));
  if (h.physiology === 'superhuman' && (h.physPicks||[]).some(p => p.startsWith('Resilient Vitality'))) hp += h.level;
  if (h.quirk && h.quirk.id === 145) hp += 3 * h.level; // Deathly Endurance
  return Math.max(1, hp);
}

function calcAC(h) {
  const dm = mod(h.stats.dex), cm = mod(h.stats.con);
  const suitAc = (h.suit && h.suit.integrity > 0) ? (h.suit.ac || 0) : 0;
  let ac = 10 + dm + suitAc;
  if (h.classId === 'striker') ac = 10 + dm + cm;
  else if (h.classId === 'arsenal') ac = Math.max(13 + Math.min(2, dm), 10 + dm + suitAc);
  if (h.classId === 'striker' && h.classKeyStat === 'dex') ac += (h.level >= 6 ? 2 : 1);
  if (h.physiology === 'heteromorph' && (h.physPicks||[]).some(p => p.startsWith('Tough Skin')) && suitAc === 0) ac += 1;
  return ac;
}

function calcQuirkDC(h) {
  const pb = pbOf(h.level);
  const st = h.classId === 'catalyst' ? h.classKeyStat : (h.quirk.stat || 'dex');
  let dc = 8 + pb + mod(h.stats[st]);
  if (h.classId === 'catalyst') dc += (h.level >= 11 ? 2 : 1);
  if (h.classId === 'striker') dc += (h.level >= 20 ? 3 : h.level >= 11 ? 2 : 1);
  if (h.classId === 'arsenal') dc += (h.level >= 11 ? 2 : 1);
  return dc;
}

function calcSpeed(h) {
  let sp = (PHYSIOLOGIES[h.physiology] || PHYSIOLOGIES.standard).speed;
  if (h.physiology === 'heteromorph' && (h.physPicks||[]).some(p => p.startsWith('Hooves'))) sp += 5;
  if (h.physiology === 'superhuman' && (h.physPicks||[]).some(p => p.startsWith('Super Speed'))) sp += 5;
  if (h.classId === 'striker') sp += CLASSES.striker.swift(h.level);
  return sp;
}

function makeHeroFromQuirk(opts) {
  const q = QUIRKS.find(x => x.id === opts.quirkId) || QUIRKS[40];
  const bg = BACKGROUNDS[opts.bgName] || BACKGROUNDS['Hero Course Student'];
  const cls = CLASSES[opts.classId] || CLASSES.catalyst;
  const h = {
    id: 'h_' + Date.now() + '_' + Math.floor(Math.random()*999),
    name: opts.name || 'New Student',
    alias: opts.alias || 'Hero Name',
    level: opts.level || 1,
    physiology: opts.physiology || 'standard',
    physPicks: opts.physPicks || [],
    classId: opts.classId || 'catalyst',
    classKeyStat: opts.classKeyStat || q.stats[0],
    combatStyle: cls.styles[0],
    spec: opts.spec || Object.keys(cls.specs)[0],
    classRes: cls.resMax(opts.level || 1, mod((opts.stats||{}).tech||10), opts.classKeyStat || q.stats[0]),
    stats: opts.stats || { str:12, dex:15, con:14, int:13, wis:13, cha:10, tech:8 },
    saves: opts.saves || { dex:true, con:true },
    skills: opts.skills || {},
    feats: opts.feats || [],
    quirk: {
      id: q.id, name: q.name, rarity: q.rarity, type: q.type,
      stat: opts.quirkStat || q.stats[0],
      weakness: q.weakness,
      inherited: opts.inherited || [],
      strain: 0,
      resources: q.resName ? [{ id:'r1', name:q.resName, cur: q.id===41||q.id===2||q.id===5||q.id===7||q.id===15||q.id===35||q.id===60||q.id===124 ? 0 : q.resMax, max:q.resMax }] : [],
      moves: q.moves.map((txt, idx) => ({ id:'m'+idx, text:txt, ult: idx === (opts.ultIdx||0) }))
    },
    hp: { cur:10, max:10, temp:0 },
    acOverride: null,
    combat: { plusUltra:true, evasionUsed:0, conditions:{} },
    suit: { tier:'Basic Super Suit', dr:2, ac:1, integrity:100, maxIntegrity:100, injectorUsed:false },
    gear: opts.gear || [],
    weapons: opts.weapons || [],
    bg: {
      name: opts.bgName || 'Hero Course Student',
      contact: bg.contacts[0], progPts: 0, yen: bg.yen, ftp: 0, isPro: bg.isPro, notes: opts.notes || ''
    }
  };
  bg.skills.forEach(s => { if (!h.skills[s]) h.skills[s] = 1; });
  h.hp.max = calcMaxHP(h);
  h.hp.cur = h.hp.max;
  return h;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (Array.isArray(p.heroes) && p.heroes.length) {
        state.heroes = p.heroes;
        state.activeId = p.activeId || p.heroes[0].id;
        return;
      }
    }
  } catch (e) {}
  const starter = makePreset('hellflame');
  state.heroes = [starter];
  state.activeId = starter.id;
  saveState();
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ heroes:state.heroes, activeId:state.activeId })); } catch (e) {}
}
const getHero = () => state.heroes.find(h => h.id === state.activeId) || state.heroes[0];

  };

function cancelWizard() { state.view = 'sheet'; render(); }
function wizGo(n) { state.wiz.step = Math.max(1, Math.min(6, n)); render(); window.scrollTo({top:0,behavior:'smooth'}); }

function wizPhysBonuses(w) {
  const b = { str:0, dex:0, con:0, int:0, wis:0, cha:0, tech:0 };
  if (w.physiology === 'standard') {
    b[w.physBonus.a] += 2; b[w.physBonus.b] += 1; b[w.physBonus.c] += 1; b[w.physBonus.d] += 1;
  } else if (w.physiology === 'standard_var') {
    b[w.physBonus.a] += 3; b[w.physBonus.b] += 1;
  } else if (w.physiology === 'quirkless') {
    b.int += 2; b.tech += 2; b[w.physBonus.a === 'cha' ? 'cha' : 'wis'] += 2;
  } else if (w.physiology === 'quirkless_var' || w.physiology === 'heteromorph') {
    b[w.physBonus.a === 'str' ? 'str' : 'dex'] += 2; b.con += 2;
  } else if (w.physiology === 'superhuman') {
    b.wis += 2; b.con += 2; b[w.physBonus.a] += 2;
  }
  return b;
}

function wizFinalStats(w) {
  const bon = wizPhysBonuses(w), out = {};
  ABILITIES.forEach(a => out[a.key] = (Number(w.baseStats[a.key])||10) + (bon[a.key]||0));
  return out;
}

function renderWizard() {
  const w = state.wiz;
  const steps = ['1. Physiology','2. Quirk (1–156)','3. Class','4. 7 Stats','5. Background','6. Review'];
  let body = '';
  if (w.step === 1) body = renderWizStep1(w);
  else if (w.step === 2) body = renderWizStep2(w);
  else if (w.step === 3) body = renderWizStep3(w);
  else if (w.step === 4) body = renderWizStep4(w);
  else if (w.step === 5) body = renderWizStep5(w);
  else body = renderWizStep6(w);

  return `
    <div class="panel stack">
      <div class="row-between" style="flex-wrap:wrap;">
        <div>
          <h2 class="hud-font" style="margin:0;color:var(--gold);font-size:20px;">⚡ CREATE HERO FROM SCRATCH</h2>
          <div style="font-size:12px;color:var(--muted);">Step-by-step MHA5e character builder</div>
        </div>
        <button class="btn-sm btn-ghost" onclick="cancelWizard()">✕ Return to Sheet</button>
      </div>
      <div class="step-bar">
        ${steps.map((s, i) => `<button class="step-pill ${w.step===i+1?'active':w.step>i+1?'done':''}" onclick="wizGo(${i+1})">${s}</button>`).join('')}
      </div>
      ${body}
      <div class="row-between" style="padding-top:10px;border-top:1px solid var(--border);">
        <button onclick="${w.step>1?`wizGo(${w.step-1})`:'cancelWizard()'}">${w.step>1?'← Back':'Cancel'}</button>
        ${w.step < 6
          ? `<button class="btn-cyan" onclick="wizGo(${w.step+1})">Next Step →</button>`
          : `<button class="btn-emerald" onclick="finishWizard()">✓ Create Hero &amp; Open Sheet</button>`}
      </div>
    </div>
  `;
}

function wizTogglePhysPick(pk) {

function rarityPill(r) {

}
function renderWizQuirkList() {
  const w = state.wiz;
  const filtered = QUIRKS.filter(q => {
    if (w.qRarity !== 'ALL' && q.rarity !== w.qRarity) return false;

      return (q.name + ' #' + q.id + ' ' + q.weakness + ' ' + q.moves.join(' ')).toLowerCase().includes(s);

      <div style="font-size:10px;color:var(--cyan);margin-top:2px;">${q.type} • ${q.stats.map(s=>s.toUpperCase()).join('/')}</div>

function wizPickQuirk(id) {

  w.quirkBornBanner = r <= failMax
    ? `d100 rolled ${r} (≤${failMax}) — Quirkless! You can switch to Quirkless Physiology or ignore this optional roll.`
    : `d100 rolled ${r} — Quirk-Born! Now roll 1–156 to discover your Quirk.`;

function wizRollRandomQuirk() {
  const r = Math.floor(Math.random() * 156) + 1;
  const q = QUIRKS.find(x => x.id === r) || QUIRKS[0];
  logRoll('Random Quirk (d156)', [r], 0, r, `#${q.id} ${q.name} (${q.rarity})`);
  state.wiz.qSearch = ''; state.wiz.qRarity = 'ALL'; state.wiz.qType = 'ALL';
  state.wiz.customQuirk = false;
  state.wiz.quirkId = q.id;

function wizRollInheritedPair() {
  let r1 = Math.floor(Math.random()*156)+1, r2 = Math.floor(Math.random()*156)+1;
  while (r2 === r1) r2 = Math.floor(Math.random()*156)+1;
  const q1 = QUIRKS.find(x=>x.id===r1), q2 = QUIRKS.find(x=>x.id===r2);
  logRoll('Inherited Quirks (2×d156)', [r1, r2], 0, r1, `#${r1} ${q1.name} & #${r2} ${q2.name}`);
  state.wiz.inheritedRolls = [r1, r2];
  state.wiz.quirkId = r1; state.wiz.quirkStat = q1.stats[0];
  state.wiz.quirkRollBanner = `🧬 Inherited Bloodline Rolls: #${r1} ${q1.name} OR #${r2} ${q2.name}`;

}

function wizRoll4d6() {

  ABILITIES.forEach((a,i) => state.wiz.baseStats[a.key] = rolls[i]);
  logRoll('4d6 Drop Lowest (7 Stats)', rolls, 0, rolls.reduce((x,y)=>x+y,0), rolls.join(', '));

function finishWizard() {
  const w = state.wiz;
  const p = PHYSIOLOGIES[w.physiology];
  const fin = wizFinalStats(w);
  const bg = BACKGROUNDS[w.bgName];
  const cls = CLASSES[w.classId];
  const skills = {};
  w.classSkills.forEach(s => skills[s] = 1);
  bg.skills.forEach(s => skills[s] = Math.max(skills[s]||0, 1));
  if (w.physiology === 'quirkless') SKILLS.filter(s=>s.stat==='int'||s.stat==='tech').forEach(s=>skills[s.id]=2);
  if (w.physiology === 'quirkless_var') SKILLS.filter(s=>s.stat==='str'||s.stat==='dex').forEach(s=>skills[s.id]=2);
  if (w.physiology === 'heteromorph') skills.survival = 2;

  const saves = {};
  w.saves.forEach(s => saves[s] = true);

  let qObj;
  if (p.quirkless) {
    qObj = { id:0, name:'Quirkless', rarity:'None', type:'None', stat:'int', weakness:'No Quirk — rely on gear, tactics & training.', inherited:[], strain:0, resources:[], moves:[] };
  } else if (w.customQuirk) {
    qObj = {
      id:0, name:w.cqName||'Custom Quirk', rarity:w.cqRarity, type:w.cqType, stat:w.cqStat,
      weakness:w.cqWeak||'Custom drawback.', inherited:w.inheritedMode?w.inheritedUpgrades:[], strain:0, resources:[],
      moves:[w.cqMove1||'Custom Move 1', w.cqMove2].filter(Boolean).map((t,i)=>({ id:'m'+i, text:t, ult:i===w.ultIdx }))
    };
  } else {
    const q = QUIRKS.find(x=>x.id===w.quirkId) || QUIRKS[0];
    qObj = {
      id:q.id, name:q.name, rarity:q.rarity, type:q.type, stat:w.quirkStat||q.stats[0],
      weakness:q.weakness, inherited:w.inheritedMode?w.inheritedUpgrades:[], strain:0,
      resources: q.resName ? [{ id:'r1', name:q.resName, cur:0, max:q.resMax }] : [],
      moves: q.moves.map((t,i)=>({ id:'m'+i, text:t, ult:i===w.ultIdx }))
    };
  }

  const hero = {
    id: 'h_' + Date.now(),
    name: w.name.trim() || 'Unnamed Hero',
    alias: w.alias.trim() || qObj.name + ' Hero',
    level: w.level || 1,
    physiology: w.physiology,
    physPicks: [...w.physPicks],
    classId: w.classId,
    classKeyStat: w.classKeyStat,
    combatStyle: cls.styles[0],
    spec: w.spec,
    classRes: cls.resMax(w.level||1, mod(fin.tech), w.classKeyStat),
    stats: fin, saves, skills, feats: [],
    quirk: qObj,
    hp: { cur:10, max:10, temp:0 },
    acOverride: null,
    combat: { plusUltra:true, evasionUsed:0, conditions:{} },
    suit: { tier:'Basic Super Suit', dr:2, ac:1, integrity:100, maxIntegrity:100, injectorUsed:false },
    gear: [], weapons: [],
    bg: { name:w.bgName, contact:w.contact, progPts:0, yen:bg.yen, ftp:0, isPro:bg.isPro, notes:'' }
  };
  hero.hp.max = calcMaxHP(hero);
  hero.hp.cur = hero.hp.max;
  state.heroes.push(hero);
  state.activeId = hero.id;
  state.view = 'sheet';
  state.tab = 'stats';
  saveState(); render();
  toast(`Welcome to Hero Society, ${hero.alias}!`, 'gold');
}

          <!-- QUICK VITALS -->
          <div class="col-7 grid g-4" style="gap:8px;">
            <div class="subcard" style="text-align:center;">
              <label class="lbl">Armor Class</label>
              <div class="hud-font" style="font-size:22px;color:var(--cyan);">${ac}</div>
            </div>
            <div class="subcard" style="text-align:center;">
              <label class="lbl">Quirk DC / PB</label>
              <div class="hud-font" style="font-size:20px;color:var(--crimson);">${qdc} <span style="font-size:13px;color:var(--muted);">/+${pb}</span></div>
            </div>
            <div class="subcard" style="text-align:center;cursor:pointer;" onclick="rollD20('Initiative',${initMod})">
              <label class="lbl">Initiative / Spd</label>
              <div class="hud-font" style="font-size:20px;color:var(--gold);">${fmt(initMod)} <span style="font-size:12px;color:var(--muted);">${spd}ft</span></div>
            </div>
            <div class="subcard" style="text-align:center;">
              <label class="lbl">Evasion ${evMax?'':'(DEX15)'}</label>
              <div class="row" style="justify-content:center;gap:5px;">
                <strong style="color:var(--emerald);">${Math.max(0,evMax-(h.combat.evasionUsed||0))}/${evMax}</strong>
                ${evMax?`<button class="btn-xs" onclick="useEvasion()">Use</button>`:''}
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 5 TABS -->
      <div class="tabs">
        ${[
          ['stats','📊 1. Stats & Skills'],
          ['quirk','🔥 2. Quirk & Combat'],
          ['class','🥊 3. Class & Features'],
          ['suit','🛡 4. Suit & Gear'],
          ['bg','📜 5. Background & Story']
        ].map(([k, lbl]) => `<button class="tab-btn ${state.tab===k?'active':''}" onclick="state.tab='${k}';render()">${lbl}</button>`).join('')}
      </div>

      ${state.tab==='stats' ? renderTabStats(h) : ''}
      ${state.tab==='quirk' ? renderTabQuirk(h) : ''}
      ${state.tab==='class' ? renderTabClass(h) : ''}
      ${state.tab==='suit' ? renderTabSuit(h) : ''}
      ${state.tab==='bg' ? renderTabBg(h) : ''}
    </div>
  `;
}

// ---------- TAB 1: STATS & SKILLS ----------
function renderTabStats(h) {
  const pb = pbOf(h.level);
  return `
    <div class="stack">
      <section class="panel">
        <div class="row-between" style="margin-bottom:10px;">
          <h3 class="hud-font" style="margin:0;color:var(--cyan);font-size:15px;">7 ABILITY SCORES (CLICK MODIFIER TO ROLL CHECK)</h3>
          <span style="font-size:11px;color:var(--muted);">Edit base score anytime • Saves add +${pb}</span>
        </div>
        <div class="grid g-7">
          ${ABILITIES.map(a => {
            const val = h.stats[a.key], m = mod(val), svProf = !!h.saves[a.key], sv = m + (svProf ? pb : 0);
            return `<div class="stat-card">
              <div class="hud-font" style="font-size:12px;color:var(--muted);">${a.abbr}</div>
              <div class="stat-mod" onclick="rollD20('${a.name} Check',${m})">${fmt(m)}</div>
              <input type="number" min="1" max="30" value="${val}" style="width:62px;text-align:center;padding:3px;font-weight:700;" onchange="editStat('${a.key}',this.value)" />
              <div class="row" style="gap:4px;margin-top:2px;">
                <button class="btn-xs ${svProf?'btn-cyan':''}" title="Toggle Save Proficiency" onclick="toggleSaveProf('${a.key}')">${svProf?'●':'○'}</button>
                <button class="btn-xs" onclick="rollD20('${a.name} Save',${sv})">Save ${fmt(sv)}</button>
              </div>
            </div>`;
          }).join('')}
        </div>
      </section>

      <section class="panel">
        <div class="row-between" style="margin-bottom:10px;">
          <h3 class="hud-font" style="margin:0;color:var(--gold);font-size:15px;">ALL 21 MHA5e SKILLS (INCLUDING QUIRK &amp; TECHNOLOGY)</h3>
          <span style="font-size:11px;color:var(--muted);">○ None • ● Prof (+${pb}) • ★ Exp (+${pb*2})</span>
        </div>
        <div class="grid g-3" style="gap:7px;">
          ${SKILLS.map(sk => {
            const lvl = h.skills[sk.id] || 0;
            const tot = mod(h.stats[sk.stat]) + lvl * pb;
            const icon = lvl === 2 ? '★' : lvl === 1 ? '●' : '○';
            return `<div class="subcard row-between" style="padding:6px 9px;">
              <div class="row" style="gap:6px;">
                <button class="btn-xs ${lvl===2?'btn-gold':lvl===1?'btn-emerald':''}" onclick="cycleSkill('${sk.id}')">${icon}</button>
                <span style="font-size:12px;font-weight:600;">${sk.name} <span style="font-size:10px;color:var(--dim);">(${sk.stat.toUpperCase()})</span></span>
              </div>
              <button class="btn-xs btn-cyan" onclick="rollD20('${sk.name}',${tot})">${fmt(tot)}</button>
            </div>`;
          }).join('')}
        </div>
      </section>
    </div>
  `;
}

// ---------- TAB 2: QUIRK & COMBAT ----------
function renderTabQuirk(h) {
  const q = h.quirk, dc = calcQuirkDC(h), qm = mod(h.stats[q.stat || 'dex']);
  const strain = q.strain || 0, strainPct = Math.min(100, (strain/15)*100);
  const strainColor = strain >= 15 ? 'var(--crimson)' : strain >= 10 ? 'var(--gold)' : 'var(--cyan)';
  return `
    <div class="grid g-12">
      <section class="panel col-7 stack">
        <div class="row-between" style="flex-wrap:wrap;">
          <div>
            <h3 class="hud-font" style="margin:0;color:var(--crimson);font-size:18px;">🔥 ${q.id?'#'+q.id+' ':''}${esc(q.name)}</h3>
            <div class="row-wrap" style="margin-top:4px;gap:5px;">
              <span class="pill ${rarityPill(q.rarity)}">${esc(q.rarity)}</span>
              <span class="pill pill-cyan">${esc(q.type)}</span>
              <span class="pill pill-gold">Save DC ${dc} (${(q.stat||'dex').toUpperCase()})</span>
              ${(q.inherited||[]).map(u=>`<span class="pill pill-emerald">🧬 ${esc(u)}</span>`).join('')}
            </div>
          </div>
          <div class="row" style="gap:6px;">
            <button class="btn-xs btn-gold" onclick="openAddMoveModal()">+ Add Move</button>
            <button class="btn-xs" onclick="openQuirkSwapModal()">Swap Quirk (1–156)</button>
          </div>
        </div>

        <div style="font-size:12px;color:#fda4af;background:var(--crimson-bg);padding:8px 10px;border-radius:8px;border:1px solid rgba(239,68,68,.35);">
          <strong>Weakness:</strong> ${esc(q.weakness)}
        </div>

        <div class="stack-sm">
          <div class="row-between">
            <label class="lbl" style="margin:0;color:var(--gold);">Quirk Moves (★ = Ultimate Move: +1 die, +10ft, +2 rds)</label>
          </div>
          ${(q.moves||[]).length ? q.moves.map(m => `
            <div class="subcard" style="padding:8px 10px;${m.ult?'border-color:var(--gold);background:rgba(245,158,11,.08);':''}">
              <div class="row-between" style="align-items:flex-start;">
                <div style="font-size:12px;">${m.ult?'<strong style="color:var(--gold);">★ ULTIMATE: </strong>':''}${linkDice(m.text)}</div>
                <div class="row" style="gap:4px;flex-shrink:0;">
                  <button class="btn-xs ${m.ult?'btn-gold':''}" title="Set Ultimate Move" onclick="starUltimate('${m.id}')">★</button>
                  <button class="btn-xs btn-crimson" onclick="delMove('${m.id}')">×</button>
                </div>
              </div>
            </div>
          `).join('') : '<div style="font-size:12px;color:var(--dim);">No moves listed. Click "+ Add Move" to add custom techniques.</div>'}
        </div>
      </section>

      <div class="col-5 stack">
        <!-- QUIRK STRAIN METER -->
        <section class="panel stack-sm">
          <div class="row-between">
            <h3 class="hud-font" style="margin:0;color:${strainColor};font-size:14px;">⚡ QUIRK STRAIN (${strain} / 15)</h3>
            <button class="btn-xs btn-cyan" onclick="rollControlCheck()">🎲 Control Check (DC ${8+strain})</button>
          </div>
          <div class="bar"><div class="bar-fill" style="width:${strainPct}%;background:${strainColor};"></div></div>
          <div class="row-wrap" style="gap:5px;">
            <button class="btn-xs" onclick="adjStrain(1)">+1 Ability / Hit</button>
            <button class="btn-xs btn-gold" onclick="adjStrain(2)">+2 Ultimate</button>
            <button class="btn-xs" onclick="adjStrain(-1)">-1</button>
            <button class="btn-xs btn-crimson" onclick="setStrain(0)">Reset 0</button>
          </div>
          ${strain >= 15
            ? `<div style="font-size:11px;color:#fda4af;font-weight:700;">🚨 LOSS OF CONTROL (15+): Concentration immediately ends! Reset Strain to 0.</div>`
            : strain >= 10
              ? `<div style="font-size:11px;color:var(--gold);font-weight:700;">⚠️ OVEREXERTED (10+): Quirk Control Checks are rolled at Disadvantage!</div>`
              : `<div style="font-size:11px;color:var(--muted);">Control Check = 1d20 ${fmt(qm)} vs DC ${8+strain}. Resets to 0 when combat ends.</div>`}
        </section>

        <!-- CUSTOM QUIRK RESOURCES -->
        <section class="panel stack-sm">
          <div class="row-between">
            <h3 class="hud-font" style="margin:0;color:var(--cyan);font-size:14px;">🔋 QUIRK RESOURCES</h3>
            <button class="btn-xs btn-cyan" onclick="openAddResModal()">+ Add Meter</button>
          </div>
          ${(q.resources||[]).length ? q.resources.map(r => {
            const pct = Math.max(0, Math.min(100, (r.cur / Math.max(1, r.max)) * 100));
            return `<div class="subcard stack-sm">
              <div class="row-between">
                <strong style="font-size:12px;">${esc(r.name)}</strong>
                <div class="row" style="gap:4px;">
                  <button class="btn-xs" onclick="adjQRes('${r.id}',-5)">-5</button>
                  <button class="btn-xs" onclick="adjQRes('${r.id}',-1)">-1</button>
                  <strong style="min-width:44px;text-align:center;color:var(--gold);">${r.cur}/${r.max}</strong>
                  <button class="btn-xs" onclick="adjQRes('${r.id}',1)">+1</button>
                  <button class="btn-xs" onclick="adjQRes('${r.id}',5)">+5</button>
                  <button class="btn-xs btn-crimson" onclick="delQRes('${r.id}')">×</button>
                </div>
              </div>
              <div class="bar"><div class="bar-fill" style="width:${pct}%;background:var(--cyan);"></div></div>
            </div>`;
          }).join('') : '<div style="font-size:11px;color:var(--dim);">No custom meters (e.g. Heat Points, Hydration, Charges).</div>'}
        </section>

        <!-- RANKED CONDITIONS -->
        <section class="panel stack-sm">
          <div class="row-between">
            <h3 class="hud-font" style="margin:0;color:var(--crimson);font-size:14px;">⚠️ RANKED CONDITIONS</h3>
            <button class="btn-xs" onclick="clearConds()">Clear All</button>
          </div>
          ${CONDITIONS.map(c => {
            const v = h.combat.conditions[c.id] || 0;
            return `<details class="subcard" style="padding:6px 8px;${v?'border-color:var(--crimson);':''}">
              <summary class="row-between">
                <span style="font-size:12px;font-weight:700;color:${v?'#fda4af':'var(--text)'};">${c.name} <span style="font-size:10px;color:var(--dim);">(rules ▾)</span></span>
                <div class="row" style="gap:4px;" onclick="event.stopPropagation()">
                  <button class="btn-xs" onclick="adjCond('${c.id}',-1)">-</button>
                  <strong style="min-width:30px;text-align:center;color:${v?'var(--crimson)':'var(--muted)'};">${v}/${c.max}</strong>
                  <button class="btn-xs" onclick="adjCond('${c.id}',1)">+</button>
                </div>
              </summary>
              <div style="font-size:11px;color:var(--muted);margin-top:5px;padding-top:5px;border-top:1px solid var(--border);">${c.rule}</div>
            </details>`;
          }).join('')}
        </section>
      </div>
    </div>
  `;
}

// ---------- TAB 3: CLASS & FEATURES ----------
function renderTabClass(h) {
  const c = CLASSES[h.classId], maxRes = c.resMax(h.level, mod(h.stats.tech), h.classKeyStat);
  return `
    <div class="grid g-12">
      <section class="panel col-7 stack">
        <div class="row-between">
          <div>
            <h3 class="hud-font" style="margin:0;color:var(--cyan);font-size:17px;">🥊 ${c.name.toUpperCase()} — LEVEL ${h.level}</h3>
            <div style="font-size:11px;color:var(--muted);">Hit Die d${c.hitDie} • ${c.armor} • ${c.weapons}</div>
          </div>
          <span class="pill pill-gold">${c.die ? 'Die: '+c.die(h.level) : 'Suit DR: '+c.suitDR(h.level)}</span>
        </div>

        <div class="grid g-3">
          <div><label class="lbl">${c.keyLabel}</label>
            <select onchange="editHero('classKeyStat',this.value)">
              ${ABILITIES.map(a=>`<option value="${a.key}" ${h.classKeyStat===a.key?'selected':''}>${a.name}</option>`).join('')}
            </select>
          </div>
          <div><label class="lbl">Combat Style (Lv2+)</label>
            <select onchange="editHero('combatStyle',this.value)">
              ${c.styles.map(s=>`<option ${h.combatStyle===s?'selected':''}>${esc(s)}</option>`).join('')}
            </select>
          </div>
          <div><label class="lbl">Specialization (Lv2+)</label>
            <select onchange="editHero('spec',this.value)">
              ${Object.keys(c.specs).map(s=>`<option ${h.spec===s?'selected':''}>${esc(s)}</option>`).join('')}
            </select>
          </div>
        </div>

        <div class="subcard" style="font-size:12px;border-color:var(--gold);">
          <strong style="color:var(--gold);">${c.keyLabel} Benefit:</strong> ${c.benefits[h.classKeyStat]}
        </div>

        <!-- INTERACTIVE PIPS -->
        <div class="subcard stack-sm">
          <div class="row-between">
            <strong style="font-size:13px;color:var(--cyan);">${c.resName} (${h.classRes} / ${maxRes} • ${c.resRest})</strong>
            <div class="row" style="gap:4px;">
              <button class="btn-xs" onclick="setClassRes(Math.max(0,getHero().classRes-1))">-1</button>
              <button class="btn-xs btn-cyan" onclick="setClassRes(${maxRes})">Refill</button>
            </div>
          </div>
          ${maxRes > 0 ? `<div class="row-wrap" style="gap:5px;">
            ${Array.from({length:maxRes}, (_,i)=>`<button class="pip ${i<h.classRes?'filled':''}" onclick="setClassRes(${i<h.classRes?i:i+1})"></button>`).join('')}
          </div>` : `<div style="font-size:11px;color:var(--muted);">Unlocks at Level 2.</div>`}
        </div>

        <div class="stack-sm">
          <label class="lbl" style="color:var(--gold);">Core Class Features</label>
          ${c.core.map(([lv, nm, ds]) => `
            <div class="subcard" style="padding:7px 9px;${lv>h.level?'opacity:.45;':''}">
              <div class="row-between"><strong style="font-size:12px;">${nm}</strong><span class="pill ${lv<=h.level?'pill-emerald':''}" style="font-size:9px;">Lv ${lv}</span></div>
              <div style="font-size:11px;color:var(--muted);">${linkDice(ds)}</div>
            </div>
          `).join('')}
        </div>
      </section>

      <div class="col-5 stack">
        <section class="panel stack-sm">
          <h3 class="hud-font" style="margin:0;color:var(--gold);font-size:14px;">⭐ ${esc(h.spec.toUpperCase())} SPECIALIZATION</h3>
          ${(c.specs[h.spec]||[]).map(s => `<div class="subcard" style="font-size:12px;padding:7px 9px;">${linkDice(s)}</div>`).join('')}
        </section>

        <section class="panel stack-sm">
          <h3 class="hud-font" style="margin:0;color:var(--cyan);font-size:14px;">🧬 ${PHYSIOLOGIES[h.physiology].name.toUpperCase()}</h3>
          ${(h.physPicks||[]).length ? `<div class="row-wrap">${h.physPicks.map(p=>`<span class="pill pill-cyan">${esc(p)}</span>`).join('')}</div>` : ''}
          <ul style="margin:4px 0 0 16px;padding:0;font-size:11px;color:var(--muted);">
            ${PHYSIOLOGIES[h.physiology].traits.map(t=>`<li>${t}</li>`).join('')}
          </ul>
        </section>

        <section class="panel stack-sm">
          <div class="row-between">
            <h3 class="hud-font" style="margin:0;color:var(--emerald);font-size:14px;">🏅 FEATS</h3>
            <button class="btn-xs btn-emerald" onclick="openAddFeatModal()">+ Add Feat</button>
          </div>
          ${(h.feats||[]).length ? h.feats.map((f,i)=>`<div class="subcard row-between" style="padding:6px 9px;font-size:12px;"><span>${esc(f)}</span><button class="btn-xs btn-crimson" onclick="delFeat(${i})">×</button></div>`).join('') : '<div style="font-size:11px;color:var(--dim);">No feats added yet.</div>'}
        </section>
      </div>
    </div>
  `;
}

// ---------- TAB 4: SUIT & GEAR ----------
function renderTabSuit(h) {
  const s = h.suit, pct = Math.max(0, Math.min(100, (s.integrity/Math.max(1,s.maxIntegrity))*100));
  const tattered = s.integrity > 0 && s.integrity <= Math.floor(s.maxIntegrity/2);
  const broken = s.integrity <= 0;
  const badge = broken ? ['BROKEN','pill-crimson','var(--crimson)'] : tattered ? ['TATTERED (-2 DR)','pill-gold','var(--gold)'] : ['OPERATIONAL','pill-emerald','var(--emerald)'];
  const effDR = broken ? 0 : Math.max(0, (s.dr||0) - (tattered?2:0)) + (h.classId==='arsenal'?CLASSES.arsenal.suitDR(h.level):0);
  const gearCap = h.bg.isPro ? 4 : 3, activeGear = (h.gear||[]).filter(g=>g.active).length;

  return `
    <div class="grid g-12">
      <section class="panel col-6 stack">
        <div class="row-between">
          <h3 class="hud-font" style="margin:0;color:var(--cyan);font-size:16px;">🛡 SUPER SUIT</h3>
          <span class="pill ${badge[1]}">${badge[0]}</span>
        </div>
        <div class="grid g-3">
          <div><label class="lbl">Suit Tier</label>
            <select onchange="changeSuitTier(this.value)">
              ${SUIT_TIERS.map(t=>`<option ${s.tier===t.name?'selected':''}>${t.name}</option>`).join('')}
            </select>
          </div>
          <div><label class="lbl">Base DR (Eff: ${effDR})</label><input type="number" value="${s.dr}" onchange="editSuit('dr',Number(this.value)||0)" /></div>
          <div><label class="lbl">AC Bonus</label><input type="number" value="${s.ac}" onchange="editSuit('ac',Number(this.value)||0)" /></div>
        </div>
        <div class="subcard stack-sm">
          <div class="row-between" style="flex-wrap:wrap;">
            <strong style="font-size:13px;">Integrity: ${s.integrity} / ${s.maxIntegrity}</strong>
            <div class="row" style="gap:4px;">
              <input id="suitDmgIn" type="number" min="1" value="12" style="width:54px;padding:3px 5px;text-align:center;" />
              <button class="btn-xs btn-crimson" onclick="applySuitHit()">Apply Hit</button>
              <button class="btn-xs btn-emerald" onclick="repairSuit(10)">+10</button>
              <button class="btn-xs btn-cyan" onclick="repairSuit(999)">Full</button>
            </div>
          </div>
          <div class="bar"><div class="bar-fill" style="width:${pct}%;background:${badge[2]};"></div></div>
          <div style="font-size:11px;color:var(--muted);">Suit Hit Rule: Loses Integrity = prevented DR + ⌈remaining dmg ÷ 2⌉.</div>
        </div>
        <div class="subcard row-between" style="font-size:12px;">
          <span>Built-in: Utility Pouch, Comms (2 mi), Tracker ID, Emergency Injector (1d10 HP)</span>
          <button class="btn-xs ${s.injectorUsed?'':'btn-emerald'}" onclick="useInjector()">${s.injectorUsed?'Restock':'💉 1d10'}</button>
        </div>
        <div class="subcard row-between">
          <strong style="color:var(--emerald);">Wealth — Yen (¥)</strong>
          <input type="number" value="${h.bg.yen||0}" style="width:120px;text-align:right;font-weight:800;" onchange="editBg('yen',Number(this.value)||0)" />
        </div>
      </section>

      <div class="col-6 stack">
        <section class="panel stack-sm">
          <div class="row-between">
            <h3 class="hud-font" style="margin:0;color:var(--gold);font-size:15px;">🎒 SUPPORT GEAR (${activeGear}/${gearCap} Active)</h3>
            <button class="btn-xs btn-cyan" onclick="openAddGearModal()">+ Add Gear</button>
          </div>
          ${(h.gear||[]).length ? h.gear.map(g => `
            <div class="subcard" style="padding:8px;${g.active?'border-color:var(--cyan);':'opacity:.6;'}">
              <div class="row-between">
                <div class="row" style="gap:6px;">
                  <button class="btn-xs ${g.active?'btn-cyan':''}" onclick="toggleGear('${g.id}')">${g.active?'Active':'Stored'}</button>
                  <strong style="font-size:12px;">${esc(g.name)}</strong>
                </div>
                <div class="row" style="gap:4px;">
                  <span style="font-size:11px;color:var(--muted);">HP ${g.hp}/${g.maxHp}</span>
                  <button class="btn-xs" onclick="adjGearHP('${g.id}',-5)">-5</button>
                  <button class="btn-xs" onclick="adjGearHP('${g.id}',5)">+5</button>
                  <button class="btn-xs btn-crimson" onclick="delGear('${g.id}')">×</button>
                </div>
              </div>
              <div style="font-size:11px;color:var(--muted);margin-top:3px;">${linkDice(g.notes)}</div>
            </div>
          `).join('') : '<div style="font-size:11px;color:var(--dim);">No support items yet.</div>'}
        </section>

        <section class="panel stack-sm">
          <div class="row-between">
            <h3 class="hud-font" style="margin:0;color:var(--crimson);font-size:15px;">🗡 WEAPONS</h3>
            <button class="btn-xs btn-crimson" onclick="openAddWeaponModal()">+ Add Weapon</button>
          </div>
          ${(h.weapons||[]).length ? h.weapons.map((w,i) => `
            <div class="subcard row-between" style="padding:7px 9px;font-size:12px;">
              <div><strong>${esc(w.name)}</strong> — ${linkDice(w.dmg)} <span style="color:var(--muted);">(${esc(w.prop)})</span></div>
              <button class="btn-xs btn-crimson" onclick="delWeapon(${i})">×</button>
            </div>
          `).join('') : '<div style="font-size:11px;color:var(--dim);">No weapons equipped.</div>'}
        </section>
      </div>
    </div>
  `;
}

function editStat(k, v) { const h = getHero(); h.stats[k] = Math.max(1, Math.min(30, Number(v)||10)); h.hp.max = calcMaxHP(h); saveState(); render(); }
function toggleSaveProf(k) { const h = getHero(); h.saves[k] = !h.saves[k]; saveState(); render(); }
function cycleSkill(id) { const h = getHero(); h.skills[id] = ((h.skills[id]||0)+1)%3; saveState(); render(); }
function togglePlusUltra() { const h = getHero(); h.combat.plusUltra = !h.combat.plusUltra; saveState(); render(); }
function useEvasion() { const h = getHero(); h.combat.evasionUsed = (h.combat.evasionUsed||0)+1; saveState(); render(); }
function adjHP(dir) {
  const h = getHero(), amt = Math.max(1, Number(document.getElementById('hpAmt')?.value)||1);
  if (dir < 0) {
    let rem = amt;
    if (h.hp.temp > 0) { const a = Math.min(h.hp.temp, rem); h.hp.temp -= a; rem -= a; }
    h.hp.cur = Math.max(0, h.hp.cur - rem);
  } else h.hp.cur = Math.min(h.hp.max, h.hp.cur + amt);
  saveState(); render();
}
function setTempHP() {
  const h = getHero(), amt = Math.max(0, Number(document.getElementById('hpAmt')?.value)||0);
  h.hp.temp = Math.max(h.hp.temp||0, amt); saveState(); render();
}
function doRest(type) {
  const h = getHero(), c = CLASSES[h.classId];
  if (type === 'short') {
    if (h.classId !== 'catalyst') h.classRes = c.resMax(h.level, mod(h.stats.tech), h.classKeyStat);
    toast('Short Rest complete!');
  } else if (type === 'long') {
    h.hp.cur = Math.min(h.hp.max, h.hp.cur + Math.ceil(h.hp.max/2));
    h.classRes = c.resMax(h.level, mod(h.stats.tech), h.classKeyStat);
    h.combat.evasionUsed = 0; h.quirk.strain = 0;
    toast('Long Rest complete (+50% HP, resources restored).', 'gold');
  } else {
    h.hp.cur = h.hp.max; h.classRes = c.resMax(h.level, mod(h.stats.tech), h.classKeyStat);
    h.combat.evasionUsed = 0; h.quirk.strain = 0;
    h.combat.conditions.bleeding = 0; h.combat.conditions.queasy = 0;
    toast('Full 24h Rest complete! Max HP & conditions restored.', 'gold');
  }
  saveState(); render();
}
function adjStrain(d) {
  const h = getHero(); h.quirk.strain = Math.max(0, Math.min(15, (h.quirk.strain||0)+d));
  if (h.quirk.strain >= 15) toast('Strain hit 15! Concentration lost — reset Strain to 0.', 'err');
  saveState(); render();
}
function setStrain(v) { getHero().quirk.strain = v; saveState(); render(); }
function rollControlCheck() {
  const h = getHero(), st = h.quirk.stat||'dex', dc = 8 + (h.quirk.strain||0);

  if ((h.quirk.strain||0) >= 10) state.rollMode = 'disadv';

}

function applySuitHit() {
  const h = getHero(), dmg = Math.max(1, Number(document.getElementById('suitDmgIn')?.value)||1), s = h.suit;
  const tattered = s.integrity > 0 && s.integrity <= Math.floor(s.maxIntegrity/2);
  const effDR = s.integrity <= 0 ? 0 : Math.max(0, (s.dr||0) - (tattered?2:0)) + (h.classId==='arsenal'?CLASSES.arsenal.suitDR(h.level):0);
  const prev = Math.min(dmg, effDR), rem = Math.max(0, dmg - prev), loss = prev + Math.ceil(rem/2);
  s.integrity = Math.max(0, s.integrity - loss);
  toast(`Suit blocked ${prev} dmg, ${rem} got through, lost ${loss} Integrity.`, 'gold');
  saveState(); render();
}

// ============================================================================
// 8. SLIDE-OVER DICE TRAY ENGINE
// ============================================================================
function linkDice(text) {
  return esc(text).replace(/\b(\d+d\d+(?:\s*[+-]\s*\d+)?)\b/gi, m => `<button class="dice-link" onclick="rollFormula('${m.replace(/\s+/g,'')}','${m}')">${m}</button>`);
}
function toggleDiceDrawer() { state.diceOpen = !state.diceOpen; renderDiceDrawer(); }
function setRollMode(m) { state.rollMode = m; renderDiceDrawer(); }
function getDiceMod() { return Number(document.getElementById('diceModInput')?.value)||0; }
function clearRollLog() { state.rollLog = []; renderDiceDrawer(); }

function rollDie(sides) {
  const r = Math.floor(Math.random()*sides)+1, b = getDiceMod();
  logRoll(`d${sides}`, [r], b, r+b, '');
}
function rollD156Tray() {
  const r = Math.floor(Math.random()*156)+1;
  const q = QUIRKS.find(x=>x.id===r);
  logRoll('Random Quirk (d156)', [r], 0, r, q ? `#${q.id} ${q.name} (${q.rarity})` : '');
}
function rollD20(label, bonus=0) {
  const m = state.rollMode;
  const cnt = m==='plusultra' ? 3 : (m==='adv'||m==='disadv' ? 2 : 1);
  const rolls = Array.from({length:cnt}, () => Math.floor(Math.random()*20)+1);
  const kept = m==='disadv' ? Math.min(...rolls) : Math.max(...rolls);
  const note = (kept===20?'NAT 20! ':kept===1?'NAT 1! ':'') + (m==='plusultra'?'PLUS ULTRA (3d20kh1)':m==='adv'?'Adv':m==='disadv'?'Disadv':'');
  logRoll(label, rolls, bonus, kept + bonus, note.trim());
}
function rollClash() {
  const r = Math.floor(Math.random()*100)+1;
  logRoll('CLASH (d100)', [r], 0, r, `+${Math.floor(r/2)} win / +${Math.floor(r/4)} lose`);
}
function rollFormula(expr, label) {
  const clean = String(expr||'').replace(/\s+/g,'').toLowerCase();
  const m = clean.match(/^(\d*)d(\d+)([+-]\d+)?$/);
  if (!m) { toast('Format like 3d6+4 or 2d10', 'err'); return; }
  const c = Math.min(50, Math.max(1, Number(m[1]||1))), s = Math.min(1000, Math.max(2, Number(m[2]))), b = Number(m[3]||0);
  const rolls = Array.from({length:c}, () => Math.floor(Math.random()*s)+1);
  logRoll(label||clean, rolls, b, rolls.reduce((x,y)=>x+y,0)+b, '');
}
function runCustomFormula() {
  const el = document.getElementById('diceFormulaInput');
  if (el && el.value.trim()) rollFormula(el.value.trim(), el.value.trim());
}
function logRoll(label, rolls, bonus, total, note) {
  state.rollLog.unshift({ label, rolls, bonus, total, note });
  if (state.rollLog.length > 30) state.rollLog.pop();
  state.diceOpen = true;
  renderDiceDrawer();
}

function renderDiceDrawer() {
  document.getElementById('diceDrawer').classList.toggle('open', state.diceOpen);
  const modes = [['normal','Normal'],['adv','Adv'],['disadv','Disadv'],['plusultra','⚡ Plus Ultra']];
  document.getElementById('diceModeBar').innerHTML = modes.map(([k, lbl]) =>
    `<button class="btn-xs ${state.rollMode===k?(k==='plusultra'?'btn-gold':'btn-cyan'):''}" onclick="setRollMode('${k}')">${lbl}</button>`
  ).join('') + `<button class="btn-xs btn-crimson" onclick="rollClash()">💥 Clash d100</button>`;

  document.getElementById('diceLog').innerHTML = state.rollLog.length
    ? state.rollLog.map(r => `<div class="subcard" style="padding:7px 9px;font-size:12px;">
        <div class="row-between"><strong style="color:var(--cyan);">${esc(r.label)}</strong><strong class="hud-font" style="font-size:17px;color:var(--gold);">${r.total}</strong></div>
        <div style="font-size:11px;color:var(--muted);">[${r.rolls.join(', ')}]${r.bonus?' '+fmt(r.bonus):''} ${r.note?'• <span style="color:var(--gold);">'+esc(r.note)+'</span>':''}</div>
      </div>`).join('')
    : '<div style="text-align:center;color:var(--dim);font-size:12px;padding:18px;">Click any stat, skill, dice link, or button to roll!</div>';
}

function toast(msg, type='') {
  const w = document.getElementById('toastWrap');
  const d = document.createElement('div');
  d.className = 'toast ' + type; d.textContent = msg;
  w.appendChild(d);
  setTimeout(() => d.remove(), 3000);
}

window.onload = function () {
  loadState();
  render();
};
</script>
</body>
</html>
